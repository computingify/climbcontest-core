[pytest]
testpaths = tests
python_files = test_*.py
addopts = -q

# `pytest` lance nu ne met PAS le repertoire courant sur sys.path -- seul
# `python -m pytest` le fait. La suite passait donc en local et echouait en CI
# avec « No module named 'climbcontest' ». On le declare explicitement plutot
# que de dependre de la facon dont pytest est appele.
pythonpath = .

# Les tests E2E lancent un vrai gunicorn. Sans limite, un serveur qui ne repond
# jamais bloquerait le job jusqu'au delai de GitHub Actions -- six heures.
timeout = 300
