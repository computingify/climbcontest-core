[pytest]
testpaths = tests
python_files = test_*.py
# ⚠️ `-n logical --dist loadgroup` : la suite tourne EN PARALLELE par defaut.
#
# ⚠️ Le parallelisme est un MULTIPLICATEUR, pas une reduction du travail. Le
# travail lui-meme a ete attaque a part -- derivation des mots de passe,
# application Flask partagee, attentes d'horloge -- et la suite fait 47 s en
# serie la ou elle en mettait 146. C'est cette ligne-la qui compte d'abord :
# `pytest -n 0` doit rester supportable, sinon on ne peut plus deboguer.
#
# Mesure du 04/09 sur le Mac : 47 s en serie, 16 s sur quatre workers, 17 s sur
# quatorze. La courbe est PLATE au-dela de quatre : le plancher est le groupe
# navigateur (15 s), qui tient sur un seul worker par construction. Ajouter des
# workers n'y change rien et ne fait qu'ajouter de la contention.
#
# `logical` et non `auto` : les deux se valent aujourd'hui -- sans `psutil`,
# xdist retombe sur `os.cpu_count()`, qui compte deja les coeurs LOGIQUES, et
# les deux donnent 14 ici comme 4 sur un runner GitHub. La difference apparait
# le jour ou `psutil` arrive dans l'environnement, ne serait-ce qu'en
# dependance indirecte : `auto` passerait alors aux coeurs PHYSIQUES et
# perdrait un tiers du Mac, sans que rien ne l'annonce. `logical` donne le meme
# compte dans les deux cas -- on choisit celui qui ne change pas d'avis.
#
# Mesure du 04/09 : 26,2 s a 2 workers, 18,4 s a 4, 18,7 s a 6, 19,1 s a 10,
# 20,3 s a 14. On garde `logical` : il vaut 4 sur un runner GitHub, donc le
# bon compte la ou ca compte, et il s'adapte tout seul ailleurs.
#
# `loadgroup` et non `loadfile` : `loadfile` garde un fichier entier sur un
# worker, donc `test_e2e.py` (35 s de gunicorn) devient a lui seul le chemin
# critique pendant que neuf workers attendent. `loadgroup` repartit test par
# test, SAUF ceux qui portent une marque `xdist_group` -- ce qui laisse a
# `tests/conftest.py` de quoi garder les tests navigateur ensemble.
#
# Pour deboguer en serie : `pytest -n 0`. (Et surtout pas
# `pytest -p no:xdist` : le greffon desactive, plus personne ne
# reconnait le `-n` de cette ligne, et pytest refuse de demarrer.)
addopts = -q -n logical --dist loadgroup

# `pytest` lance nu ne met PAS le repertoire courant sur sys.path -- seul
# `python -m pytest` le fait. La suite passait donc en local et echouait en CI
# avec « No module named 'climbcontest' ». On le declare explicitement plutot
# que de dependre de la facon dont pytest est appele.
pythonpath = .

# Les tests E2E lancent un vrai gunicorn. Sans limite, un serveur qui ne repond
# jamais bloquerait le job jusqu'au delai de GitHub Actions -- six heures.
timeout = 300
