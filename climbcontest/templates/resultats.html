<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Résultats — ClimbContest</title>
<!-- Favicon en ligne : evite un 404 a chaque chargement, sans dependre d'un
     fichier de plus. Une prise d'escalade, tiree du sujet. -->
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='7' fill='%232F6BB0'/><circle cx='16' cy='12' r='5' fill='%23EEF1F5'/><path d='M11 19h10l-2 8h-6z' fill='%23EEF1F5'/></svg>">
<style>
  /* ---------------------------------------------------------------------
     Identité tirée du sujet : les six couleurs de circuit du club, dans
     leur ordre de difficulté. Chaque catégorie en reçoit une, ce qui rend
     un changement de catégorie visible à cinq mètres AVANT d'être lu.

     Aucune police téléchargée, aucune bibliothèque : une page projetée
     pendant une compétition ne peut pas dépendre d'un service extérieur.
     Si la box Internet tombe à 10 h, l'écran de la salle doit continuer.
     --------------------------------------------------------------------- */
  :root {
    --c1: #C8901F;  /* Jaune */
    --c2: #4E9A5A;  /* Vert  */
    --c3: #2F6BB0;  /* Bleu  */
    --c4: #7A4F99;  /* Mauve */
    --c5: #B33F33;  /* Rouge */
    --c6: #5A6070;  /* Noir, éclairci pour rester lisible sur fond sombre */

    --fond: #0E1116;
    --carte: #171B23;
    --carte2: #1E232D;
    --trait: #2B313D;
    --encre: #EEF1F5;
    --encre2: #9AA4B4;
    --alerte: #E0705F;

    --accent: var(--c3);

    --titre: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    --chiffre: ui-monospace, "SF Mono", "Cascadia Mono", Menlo, Consolas, monospace;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0; height: 100%;
    background: var(--fond); color: var(--encre);
    font-family: var(--titre);
    -webkit-font-smoothing: antialiased;
  }

  body { display: flex; flex-direction: column; }

  /* ---- Bandeau ---- */
  header {
    display: flex; align-items: baseline; gap: 16px; flex-wrap: wrap;
    padding: 18px 24px 14px;
    border-bottom: 2px solid var(--accent);
    background: linear-gradient(180deg, var(--carte), var(--fond));
  }
  h1 {
    margin: 0; font-size: clamp(1.1rem, 2.2vw, 1.6rem);
    font-weight: 800; letter-spacing: -0.02em;
  }
  #competition { color: var(--encre2); font-size: 0.95rem; }
  #fraicheur {
    margin-left: auto; font-family: var(--chiffre); font-size: 0.85rem;
    color: var(--encre2); white-space: nowrap;
  }
  #fraicheur.perime { color: var(--alerte); font-weight: 600; }

  /* ---- Barre de catégories (mode spectateur) ---- */
  #barre {
    display: flex; gap: 8px; overflow-x: auto; padding: 12px 24px;
    border-bottom: 1px solid var(--trait);
  }
  #barre button {
    flex: 0 0 auto; cursor: pointer;
    background: var(--carte); color: var(--encre2);
    border: 1px solid var(--trait); border-radius: 999px;
    padding: 7px 15px; font: inherit; font-size: 0.9rem; font-weight: 600;
    border-left: 4px solid var(--groupe, var(--trait));
  }
  #barre button[aria-pressed="true"] {
    background: var(--groupe, var(--accent)); color: #0E1116; border-color: transparent;
  }
  #barre button:focus-visible { outline: 2px solid var(--encre); outline-offset: 2px; }

  #recherche {
    margin: 12px 24px 0; padding: 11px 14px; width: calc(100% - 48px); max-width: 420px;
    background: var(--carte); color: var(--encre);
    border: 1px solid var(--trait); border-radius: 10px; font: inherit;
  }
  #recherche::placeholder { color: var(--encre2); }
  #recherche:focus { outline: 2px solid var(--accent); outline-offset: 1px; }

  /* ---- Le classement ---- */
  main { flex: 1; overflow-y: auto; padding: 16px 24px 32px; }

  #titreGroupe {
    display: flex; align-items: center; gap: 12px;
    margin: 6px 0 14px; font-size: clamp(1.3rem, 3vw, 2rem); font-weight: 800;
    letter-spacing: -0.02em;
  }
  #titreGroupe::before {
    content: ""; width: 10px; height: 1.1em; border-radius: 3px;
    background: var(--groupe, var(--accent));
  }
  #titreGroupe span {
    color: var(--encre2); font-size: 0.55em; font-weight: 500;
    margin-left: 0.6em;      /* sans quoi « U11 F » et « 24 grimpeurs » se collent */
  }

  ol { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; }

  li {
    display: grid;
    grid-template-columns: 3.2em 1fr auto;
    align-items: center; gap: 14px;
    background: var(--carte); border-radius: 10px;
    padding: 11px 16px;
    border-left: 4px solid transparent;
    /* Le rafraîchissement est « en douceur » : on ne fait pas sauter les
       lignes, on les laisse glisser. Une réussite tardive peut faire
       BAISSER un score sans que le grimpeur ait rien fait -- projeté sur un
       mur, un mouvement brutal se lirait comme un bug. */
    transition: background 400ms ease, border-color 400ms ease;
  }
  li.podium { background: var(--carte2); border-left-color: var(--groupe, var(--accent)); }

  .rang {
    font-family: var(--chiffre); font-size: 1.15em; font-weight: 600;
    color: var(--encre2); text-align: right; font-variant-numeric: tabular-nums;
  }
  li.podium .rang { color: var(--groupe, var(--accent)); font-size: 1.4em; }

  .qui { min-width: 0; }
  .nom {
    font-weight: 600; font-size: 1.05em;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .club {
    color: var(--encre2); font-size: 0.82em;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }

  .score {
    font-family: var(--chiffre); font-size: 1.25em; font-weight: 600;
    font-variant-numeric: tabular-nums; text-align: right;
  }
  .blocs { color: var(--encre2); font-size: 0.75em; font-weight: 400; }

  #message {
    text-align: center; color: var(--encre2);
    padding: 60px 24px; font-size: 1.1rem; line-height: 1.6;
  }
  #message strong { color: var(--encre); display: block; font-size: 1.3rem; margin-bottom: 8px; }

  /* Avant le premier scan, tout le monde est a zero. Le classement est juste,
     mais projete sur un mur pendant la premiere demi-heure il se lit comme un
     ecran casse. On le dit, et on garde la liste : voir les inscrits affiches
     rassure sur le fait que le systeme tourne. */
  #attente {
    background: var(--carte2); border-left: 4px solid var(--groupe, var(--accent));
    border-radius: 0 10px 10px 0; padding: 12px 18px; margin-bottom: 14px;
    color: var(--encre2); font-size: 0.95em;
  }
  body.mur #attente { font-size: 1.3rem; padding: 18px 26px; }

  /* ---- Mode mur : lu a 5 metres, personne ne touche l'ecran ---- */
  body.mur #barre, body.mur #recherche { display: none; }

  /* `rem` se calcule sur la RACINE, pas sur `body` : agrandir `body` ne
     changeait rien aux tailles exprimees en rem. Un nom sortait a 27 px la ou
     il en faut ~40 pour etre lu a cinq metres sur un ecran 1080p. */
  html:has(body.mur) { font-size: 24px; }
  body.mur { font-size: 1rem; }
  body.mur h1 { font-size: 2rem; }
  body.mur #fraicheur { font-size: 1.1rem; }
  body.mur #titreGroupe { font-size: clamp(2rem, 5vw, 3.4rem); }
  body.mur li { padding: 14px 22px; gap: 20px; grid-template-columns: 2.6em 1fr auto; }
  body.mur .nom { font-size: 1.75rem; }
  body.mur .club { font-size: 1rem; }
  body.mur .score { font-size: 2rem; }
  body.mur .rang { font-size: 1.8rem; }
  body.mur li.podium .rang { font-size: 2.2rem; }
  body.mur main { padding: 20px 40px; }

  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>

<header>
  <h1>Résultats</h1>
  <span id="competition"></span>
  <span id="fraicheur">chargement…</span>
</header>

<div id="barre" role="group" aria-label="Catégories"></div>
<input id="recherche" type="search" placeholder="Chercher un nom ou un dossard…"
       autocomplete="off" aria-label="Chercher un grimpeur">

<main>
  <div id="titreGroupe" hidden></div>
  <div id="attente" hidden></div>
  <ol id="classement"></ol>
  <div id="message"></div>
</main>

<script>
(function () {
  "use strict";

  // Les six couleurs de circuit, attribuées aux groupes dans l'ordre. C'est
  // ce qui rend un changement de catégorie visible avant d'être lu.
  var COULEURS = ["var(--c1)","var(--c2)","var(--c3)","var(--c4)","var(--c5)","var(--c6)"];

  var MUR = location.search.indexOf("mur") !== -1;
  var PERIODE_MS = 15000;      // rafraîchissement
  var ROTATION_MS = 20000;     // mode mur : durée d'affichage d'une catégorie
  var PERIME_MS = 60000;       // au-delà, l'âge passe en rouge

  var etat = {
    classements: [],           // dernier classement CONNU. Jamais vidé sur erreur.
    competition: null,
    calculeLe: null,           // horodatage serveur, en secondes
    ageServeurS: 0,            // âge du calcul AU MOMENT où le serveur a répondu
    recuA: null,               // heure locale de réception
    groupe: null,
    enPanne: false,
  };

  var el = {
    barre: document.getElementById("barre"),
    recherche: document.getElementById("recherche"),
    titre: document.getElementById("titreGroupe"),
    attente: document.getElementById("attente"),
    liste: document.getElementById("classement"),
    message: document.getElementById("message"),
    fraicheur: document.getElementById("fraicheur"),
    competition: document.getElementById("competition"),
  };

  if (MUR) document.body.classList.add("mur");

  function couleurDe(nomGroupe) {
    var i = etat.classements.findIndex(function (c) { return c.groupe === nomGroupe; });
    return COULEURS[(i < 0 ? 0 : i) % COULEURS.length];
  }

  // --- Récupération ---------------------------------------------------------

  function charger() {
    fetch("/api/public/classement", { cache: "no-store" })
      .then(function (r) {
        if (r.status === 409) return r.json().then(function (d) { throw { metier: d.message }; });
        if (!r.ok) throw new Error("HTTP " + r.status);
        return r.json();
      })
      .then(function (d) {
        etat.classements = d.classements || [];
        etat.competition = d.competition || null;
        etat.calculeLe = d.calcule_le || null;
        etat.ageServeurS = typeof d.age_s === "number" ? d.age_s : 0;
        etat.recuA = Date.now();
        etat.enPanne = false;
        etat.messageMetier = null;
        if (!etat.groupe && etat.classements.length) etat.groupe = etat.classements[0].groupe;
        dessiner();
      })
      .catch(function (e) {
        // On NE VIDE PAS. Une page de résultats qui se vide parce qu'une
        // requête a échoué est pire qu'une page en retard : elle fait croire
        // que la compétition s'est arrêtée.
        if (e && e.metier) { etat.messageMetier = e.metier; etat.classements = []; }
        etat.enPanne = true;
        dessiner();
      });
  }

  // --- Rendu ----------------------------------------------------------------

  function dessiner() {
    majFraicheur();
    el.competition.textContent = etat.competition ? etat.competition.nom : "";

    if (etat.messageMetier) {
      return afficherMessage("Pas de compétition en cours", etat.messageMetier);
    }
    if (!etat.classements.length) {
      return afficherMessage(
        etat.enPanne ? "Serveur injoignable" : "En attente des premiers résultats",
        etat.enPanne ? "La page réessaie toutes les 15 secondes."
                     : "Le classement s'affichera dès la première réussite enregistrée.");
    }

    var groupe = etat.classements.find(function (c) { return c.groupe === etat.groupe; })
              || etat.classements[0];
    etat.groupe = groupe.groupe;
    document.documentElement.style.setProperty("--groupe", couleurDe(groupe.groupe));

    dessinerBarre();

    var q = el.recherche.value.trim().toLowerCase();
    var lignes, titreTexte, compteTexte;

    if (q) {
      // La recherche traverse TOUTES les categories, pas seulement celle
      // affichee. Un parent qui cherche son enfant ne connait pas forcement sa
      // categorie -- c'est meme le cas le plus frequent, et une recherche qui
      // ne trouve rien parce qu'on regardait le mauvais onglet serait pire que
      // pas de recherche du tout.
      lignes = [];
      etat.classements.forEach(function (c) {
        (c.lignes || []).forEach(function (l) {
          if ((l.nom || "").toLowerCase().indexOf(q) !== -1
              || String(l.dossard || "").indexOf(q) !== -1) {
            // On copie pour porter la categorie sans toucher aux donnees.
            // Un grimpeur figure dans DEUX classements : sa categorie
            // (« U13 F ») et son circuit, le « scratch » (« U13 »), ou il est
            // classe avec les filles et les garcons ensemble. Les deux lignes
            // sont justes et leurs rangs different -- mais sans etiquette elles
            // passent pour un doublon.
            lignes.push({ rang: l.rang, score: l.score, blocs: l.blocs, nom: l.nom,
                          club: l.club, dossard: l.dossard,
                          groupe: c.type === "circuit" ? c.groupe + " scratch" : c.groupe });
          }
        });
      });
      titreTexte = "Recherche";
      compteTexte = lignes.length + (lignes.length > 1 ? " résultats" : " résultat");
    } else {
      lignes = groupe.lignes || [];
      titreTexte = groupe.groupe;
      compteTexte = lignes.length + " grimpeurs";
    }

    el.titre.hidden = false;
    el.titre.innerHTML = "";
    el.titre.appendChild(document.createTextNode(titreTexte));
    var compte = document.createElement("span");
    compte.textContent = compteTexte;
    el.titre.appendChild(compte);

    // Personne n'a encore rien reussi : on l'annonce au lieu de laisser croire
    // a un classement fige. La liste reste affichee -- voir les inscrits
    // rassure sur le fait que le systeme tourne.
    var toutAZero = lignes.length > 0 && lignes.every(function (l) { return !l.score; });
    el.attente.hidden = !toutAZero;
    if (toutAZero) {
      el.attente.textContent = "En attente des premières réussites — "
        + lignes.length + " grimpeurs inscrits, aucun bloc validé pour l'instant.";
    }

    if (!lignes.length) {
      el.attente.hidden = true;
      el.liste.innerHTML = "";
      return afficherMessage("Aucun grimpeur trouvé",
        q ? "Aucun nom ni dossard ne correspond à « " + q + " », dans aucune catégorie."
          : "Ce classement est vide pour l'instant.");
    }

    el.message.textContent = "";
    el.liste.innerHTML = "";
    lignes.forEach(function (l) { el.liste.appendChild(ligne(l)); });
  }

  function ligne(l) {
    var li = document.createElement("li");
    if (l.rang <= 3 && !el.recherche.value.trim()) li.className = "podium";

    var rang = document.createElement("div");
    rang.className = "rang";
    rang.textContent = l.rang;

    var qui = document.createElement("div");
    qui.className = "qui";
    var nom = document.createElement("div");
    nom.className = "nom";
    // textContent, jamais innerHTML : les noms viennent de la base.
    nom.textContent = l.nom || ("Dossard " + l.dossard);
    var club = document.createElement("div");
    club.className = "club";
    // En recherche, la categorie est l'information la plus utile : c'est elle
    // que le parent ne connaissait pas.
    club.textContent = [l.groupe, l.club, l.dossard ? "n°" + l.dossard : null]
      .filter(Boolean).join(" · ");
    qui.appendChild(nom); qui.appendChild(club);

    var score = document.createElement("div");
    score.className = "score";
    score.textContent = l.score;
    var blocs = document.createElement("div");
    blocs.className = "blocs";
    blocs.textContent = l.blocs + (l.blocs > 1 ? " blocs" : " bloc");
    score.appendChild(document.createElement("br"));
    score.appendChild(blocs);

    li.appendChild(rang); li.appendChild(qui); li.appendChild(score);
    return li;
  }

  function dessinerBarre() {
    // Une seule catégorie : pas de sélecteur, il ne servirait à rien.
    if (etat.classements.length < 2) { el.barre.innerHTML = ""; return; }
    if (el.barre.childElementCount === etat.classements.length) {
      Array.prototype.forEach.call(el.barre.children, function (b) {
        b.setAttribute("aria-pressed", String(b.dataset.groupe === etat.groupe));
      });
      return;
    }
    el.barre.innerHTML = "";
    etat.classements.forEach(function (c, i) {
      var b = document.createElement("button");
      b.type = "button";
      b.textContent = c.groupe;
      b.dataset.groupe = c.groupe;
      b.style.setProperty("--groupe", COULEURS[i % COULEURS.length]);
      b.setAttribute("aria-pressed", String(c.groupe === etat.groupe));
      b.addEventListener("click", function () { etat.groupe = c.groupe; dessiner(); });
      el.barre.appendChild(b);
    });
  }

  function afficherMessage(titre, detail) {
    el.titre.hidden = true;
    el.attente.hidden = true;
    el.liste.innerHTML = "";
    el.message.innerHTML = "";
    var t = document.createElement("strong");
    t.textContent = titre;
    el.message.appendChild(t);
    el.message.appendChild(document.createTextNode(detail));
  }

  function majFraicheur() {
    if (!etat.recuA) { el.fraicheur.textContent = "chargement…"; return; }
    // L'age vrai = ce que le serveur avait deja + ce qui s'est ecoule depuis.
    // Mesurer depuis la seule reception afficherait « il y a 1 s » pour un
    // classement que le cache garde depuis 5 s.
    var age = Math.round(etat.ageServeurS + (Date.now() - etat.recuA) / 1000);
    var texte = age < 5 ? "à l'instant" : "il y a " + age + " s";
    el.fraicheur.textContent = etat.enPanne
      ? "hors ligne — dernier classement " + texte
      : "calculé " + texte;
    el.fraicheur.classList.toggle("perime", etat.enPanne || age * 1000 > PERIME_MS);
  }

  // --- Boucles --------------------------------------------------------------

  el.recherche.addEventListener("input", dessiner);

  charger();
  setInterval(charger, PERIODE_MS);
  setInterval(majFraicheur, 1000);

  if (MUR) {
    // La rotation ne s'arrête jamais et n'attend aucune interaction :
    // l'écran est accroché en hauteur, personne ne le touchera de la journée.
    setInterval(function () {
      if (etat.classements.length < 2) return;
      var i = etat.classements.findIndex(function (c) { return c.groupe === etat.groupe; });
      etat.groupe = etat.classements[(i + 1) % etat.classements.length].groupe;
      dessiner();
    }, ROTATION_MS);
  }
})();
</script>
</body>
</html>
