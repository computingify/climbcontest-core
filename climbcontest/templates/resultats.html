<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Résultats — ClimbContest</title>
<!-- Favicon en ligne : evite un 404 a chaque chargement, sans dependre d'un
     fichier de plus. Une prise d'escalade, tiree du sujet. -->
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='7' fill='%232F6BB0'/><circle cx='16' cy='12' r='5' fill='%23EEF1F5'/><path d='M11 19h10l-2 8h-6z' fill='%23EEF1F5'/></svg>">
<style>
  /* ---------------------------------------------------------------------
     Spec 016 — cette page est faite pour être PROJETÉE.

     Le fond est CLAIR par défaut, et ce n'est pas une question de goût : un
     vidéoprojecteur ajoute de la lumière sur un mur, il n'en retire pas. Un
     fond sombre n'est pas « sombre », c'est du mur non éclairé — et dans une
     salle d'escalade qu'on ne peut pas plonger dans le noir, le contraste
     s'effondre. `?sombre` reste là pour un écran LED ou une salle obscure.

     Les six couleurs de circuit du club servent d'identité : chaque groupe en
     reçoit une, ce qui rend un changement de catégorie visible à cinq mètres
     AVANT d'être lu.

     Aucune police téléchargée, aucune bibliothèque, aucune requête sortante :
     si la box Internet tombe à 10 h, l'écran de la salle continue.
     --------------------------------------------------------------------- */
  :root {
    --c1: #B8860B;  /* Jaune  */
    --c2: #2F7D46;  /* Vert   */
    --c3: #2F6BB0;  /* Bleu   */
    --c4: #6C4292;  /* Mauve  */
    --c5: #B33F33;  /* Rouge  */
    --c6: #3C4453;  /* Noir   */

    --fond: #F1F4F8;
    --carte: #FFFFFF;
    --carte2: #E9EDF3;
    --trait: #D8DEE7;
    --encre: #0E1420;
    --encre2: #5A6472;
    --alerte: #B3352A;
    --ok: #1E7A45;
    --or: #EFB61E;        --or-encre: #A87A00;      /* jaune franc */
    --argent: #B6BFCA;    --argent-encre: #6C7684;  /* gris neutre */
    --bronze: #C4703A;    --bronze-encre: #8A4820;  /* cuivre */
    --encre3: #7B8494;
    --zebre: #E9EDF3;                 /* zébrure : neutre et très peu saturée */

    --groupe: var(--c3);
    --titre: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    --chiffre: ui-monospace, "SF Mono", "Cascadia Mono", Menlo, Consolas, monospace;
  }

  /* Le mode sombre reste atteignable : ?sombre */
  body.sombre {
    --c1: #E0A93B; --c2: #57B073; --c3: #5C9BE0; --c4: #A97FD0;
    --c5: #E0705F; --c6: #96A0B2;
    --fond: #0B0F17; --carte: #161B24; --carte2: #1E2430; --trait: #2A313D;
    --encre: #F0F3F8; --encre2: #97A2B2; --alerte: #E0705F; --ok: #57D58D;
    --or: #F0C13F;        --or-encre: #F0C13F;
    --argent: #C3CBD7;    --argent-encre: #C3CBD7;
    --bronze: #D08B52;    --bronze-encre: #D08B52;
    --encre3: #798398; --zebre: #12171F;
  }

  * { box-sizing: border-box; }

  /* ⚠️ `hidden` DOIT cacher. Une regle d'AUTEUR qui pose `display` bat le
     `[hidden] { display: none }` de la feuille du NAVIGATEUR : l'origine
     auteur l'emporte sur l'origine agent-utilisateur, quelle que soit la
     specificite.

     Ici, `#barre { display: flex }`. Quand la competition n'a qu'UNE seule
     categorie, le script vide la barre et la passe en `hidden` -- elle restait
     une bande vide de 21 px, avec son filet, sous l'entete. Mesure : `display`
     calcule `flex`, hauteur 21 px, `border-bottom` 1 px. Sur le
     videoprojecteur de la salle, c'est une bande noire en travers de l'ecran.

     `#attente`, l'autre element pilote par `hidden`, ne pose aucun `display`
     et se cachait deja correctement -- c'est bien la regle d'affichage qui
     fait la difference, pas l'attribut.

     Meme regle, meme place, que `admin.html`, `juge.html` et `plan.html`. */
  [hidden] { display: none !important; }
  html, body {
    margin: 0; height: 100%;
    background: var(--fond); color: var(--encre);
    font-family: var(--titre); -webkit-font-smoothing: antialiased;
  }
  body { display: flex; flex-direction: column; overflow: hidden; }
  body:not(.mur) { overflow-y: auto; overflow-x: hidden; }


  /* ---- Bandeau ---- */
  header {
    flex: none; display: flex; align-items: center; gap: 18px;
    padding: 14px 24px 12px; border-bottom: 1px solid var(--trait);
  }
  .logo { height: 46px; width: auto; flex: none; }
  body.mur .logo { height: clamp(38px, 4.2vw, 66px); }

  .titre-groupe {
    display: flex; align-items: center; gap: 14px; min-width: 0;
    font-size: clamp(1.4rem, 3vw, 2rem); font-weight: 900; letter-spacing: -0.03em;
    color: var(--groupe); line-height: 1;
  }
  body.mur .titre-groupe { font-size: clamp(1.7rem, 3.6vw, 62px); }
  .titre-groupe span { white-space: nowrap; }
  .titre-groupe .pastille {
    width: 12px; height: 1em; border-radius: 4px; background: var(--groupe); flex: none;
  }
  body.mur .titre-groupe .pastille { width: 18px; }
  #compte { color: var(--encre2); font-weight: 600; font-size: 0.95rem; white-space: nowrap; }
  body.mur #compte { font-size: clamp(0.9rem, 1.35vw, 25px); }

  .droite { margin-left: auto; text-align: right; min-width: 0; }
  #competition { font-weight: 800; font-size: 1rem; }
  body.mur #competition { font-size: clamp(1rem, 1.6vw, 28px); }
  .meta {
    color: var(--encre2); font-size: 0.78rem; margin-top: 2px;
    font-variant-numeric: tabular-nums; white-space: nowrap;
  }
  body.mur .meta { font-size: clamp(0.72rem, 1.1vw, 19px); margin-top: 4px; }
  .meta .perime { color: var(--alerte); font-weight: 700; }
  /* Le bouton de rotation. Il n'existe qu'en mode mur : c'est l'organisateur,
     depuis la machine qui projette, qui fige une catégorie — pendant une remise
     de prix, ou quand quelqu'un demande « laisse la U13 F ». */
  .commande {
    display: none; flex: none; cursor: pointer; font: inherit; line-height: 1;
    background: var(--carte); color: var(--encre2);
    border: 1px solid var(--trait); border-radius: 999px;
    width: 2.4em; height: 2.4em; font-size: clamp(1rem, 1.5vw, 1.6rem);
  }
  body.mur .commande { display: block; }
  /* ⚠️ `.commande` est masquée par défaut et ne s'affiche qu'en mode mur : la
     règle ci-dessus est celle de #pause, et #pause en dépend. « Masquer la
     recherche » fait l'inverse — elle sert justement quand on projette SANS le
     mode mur, sur le portable branché au vidéoprojecteur. D'où sa propre
     classe, plutôt qu'une exception glissée dans la règle existante. */
  .commande.hors-mur { display: block; }
  body.mur .commande.hors-mur { display: none; }
  /* ⚠️ Le bouton de rotation, lui, existe DES DEUX COTES. Il n'apparaissait
     qu'en `?mur` : sur la page normale -- celle qu'on branche au
     videoprojecteur sans passer par `?mur`, exactement comme la loupe
     ci-dessus -- rien ne permettait de lancer ni d'arreter le defilement.
     « Je n'ai plus le bouton play et pause sur l'écran résultat », Adrien
     02/09. Sur le mur il demarre en lecture ; ailleurs, a l'arret. */
  .commande.partout { display: block; }
  .commande:hover { background: var(--carte2); color: var(--encre); }
  .commande[aria-pressed="true"] { border-color: var(--groupe); color: var(--groupe); }
  .commande:focus-visible { outline: 2px solid var(--groupe); outline-offset: 2px; }

  #suivant { color: var(--encre2); font-size: 0.78rem; margin-top: 2px; display: none; }
  body.mur #suivant { display: block; font-size: clamp(0.72rem, 1.15vw, 20px); }

  /* ---- La barre de catégories : la MÊME sur le mur et sur le téléphone ----
     Sur le mur elle dit OÙ ON EN EST dans le cycle — la catégorie affichée s'y
     remplit doucement jusqu'à la bascule. Sur un téléphone, c'est le sélecteur :
     on touche une catégorie, on ne voit qu'elle. Un seul composant, deux
     usages : c'est ce qui fait qu'ils ne divergeront pas. */
  #barre {
    flex: none; display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none;
    padding: 10px 24px; border-bottom: 1px solid var(--trait);
  }
  #barre::-webkit-scrollbar { display: none; }
  body.mur #barre { padding: 12px 32px; gap: 10px; }
  #barre button {
    position: relative; overflow: hidden; flex: 0 0 auto; cursor: pointer;
    background: var(--carte); color: var(--encre2);
    border: 1px solid var(--trait); border-radius: 999px;
    padding: 7px 16px; font: inherit; font-size: 0.9rem; font-weight: 600;
    border-left: 4px solid var(--teinte, var(--trait));
  }
  body.mur #barre button {
    font-size: clamp(0.9rem, 1.15vw, 1.35rem); padding: 9px 22px; border-left-width: 6px;
  }
  #barre button[aria-current="true"] {
    color: var(--encre); border-color: var(--teinte, var(--groupe));
    box-shadow: inset 0 0 0 1px var(--teinte, var(--groupe));
  }
  /* La jauge : elle avance pendant toute la durée d'affichage, donc on VOIT
     venir la bascule au lieu de la subir. */
  #barre .jauge {
    position: absolute; left: 0; top: 0; bottom: 0; width: 0;
    background: color-mix(in srgb, var(--teinte, var(--groupe)) 26%, transparent);
  }
  #barre .etiquette { position: relative; }
  #barre button:focus-visible { outline: 2px solid var(--encre); outline-offset: 2px; }
  #recherche {
    flex: none; margin: 12px 24px 0; padding: 11px 14px;
    width: calc(100% - 48px); max-width: 420px;
    background: var(--carte); color: var(--encre);
    border: 1px solid var(--trait); border-radius: 10px; font: inherit;
  }
  #recherche::placeholder { color: var(--encre2); }
  body.mur #recherche { display: none; }
  body.sans-recherche #recherche { display: none; }

  /* ---- Le classement ---- */
  main { flex: 1; min-height: 0; display: flex; flex-direction: column;
         padding: 14px 24px 22px; gap: 14px; }
  body.mur main { padding: 16px 32px 22px; }

  #attente {
    flex: none; background: var(--carte2); border-left: 5px solid var(--groupe);
    border-radius: 0 10px 10px 0; padding: 12px 18px; color: var(--encre2);
  }
  body.mur #attente { font-size: 1.35rem; padding: 18px 26px; }

  /* Le podium, en MARCHES : le premier au centre et plus haut, le deuxième à
     gauche, le troisième à droite et plus bas encore. C'est la forme qu'on
     reconnaît sans la lire — demandée par Adrien le 31/08.

     ⚠️ Il ne dépend PLUS du mode mur, mais de la LARGEUR (Adrien, 01/09) :
     « je veux toujours avoir le podium […] lorsque la page le permet ». Le
     portable de la salle et la relecture d'une archive l'affichent donc comme
     le vidéoprojecteur — c'est la même page, et rien dans un podium n'appelait
     un vidéoprojecteur plutôt qu'un écran. Sur un téléphone, où il mangerait
     tout l'écran, il ne s'affiche toujours pas : c'est `peindre()` qui tranche,
     sur `LARGEUR_PODIUM`. */
  /* Une marche EN ATTENTE : le socle est là, la carte n'y est pas encore.
     Un liseré en pointillé plutôt qu'une carte grise — on doit lire « pas
     encore » et non « quelqu'un dont on ne connaît pas le nom ». */
  #podium .groupe.attente .cartes::after {
    content: "—"; display: flex; align-items: center; justify-content: center;
    width: 100%; height: 100%; min-height: 46px;
    border: 2px dashed var(--trait); border-radius: 14px;
    color: var(--encre3); font-size: 1.4rem; font-weight: 700;
  }
  #podium .groupe.attente .socle { opacity: .38; }

  #podium { flex: none; display: none; gap: 20px; align-items: end;
            height: clamp(150px, 23vh, 250px); }
  #podium.visible { display: flex; }

  /* UNE MARCHE PAR RANG, et les ex æquo la partagent — ils sont à égalité, ils
     doivent être au même niveau (Adrien, 31/08). La marche porte donc un
     GROUPE de cartes, pas une carte. */
  .groupe {
    display: flex; flex-direction: column; justify-content: flex-end;
    flex: 1 1 0; min-width: 0;
  }
  .groupe .cartes { display: flex; gap: 10px; min-width: 0; align-items: stretch; }
  .groupe .cartes > .pod { flex: 1 1 0; min-width: 0; }
  .groupe .socle { border-radius: 0 0 6px 6px; background: var(--medaille); }
  .groupe.place-1 { order: 2; padding-bottom: 52px; flex-grow: 1.15; }
  .groupe.place-2 { order: 1; padding-bottom: 26px; }
  .groupe.place-3 { order: 3; padding-bottom: 0; }
  .groupe.place-1 .socle { height: 30px; }
  .groupe.place-2 .socle { height: 20px; }
  .groupe.place-3 .socle { height: 12px; }
  /* La place dans la RANGÉE vient du rang affiché (1er au centre), la médaille
     vient du rang réel : deux ex æquo en tête portent deux fois l'or. C'est la
     MARCHE qui porte la position — voir `.marche.place-N` plus bas. */
  .pod {
    /* ⚠️ `minmax(0, 1fr)` et surtout PAS `1fr`. Le `min-width` par defaut
       d'une piste de grille vaut `auto` : la colonne ne peut alors jamais
       devenir plus etroite que son contenu le plus large. Or `.chiffres` est
       en `nowrap` — « 3118  16 blocs  −1700 » ne se coupe nulle part. La
       colonne reclamait donc 404 px dans une carte de 373, et le nom, le club
       et les chiffres sortaient de 9 px PAR LA DROITE, par-dessus le bord
       arrondi. L'ellipse de `.nom` ne servait a rien : elle se calculait sur
       une largeur qui debordait deja. */
    display: grid; grid-template-columns: clamp(56px, 5.6vw, 100px) minmax(0, 1fr);
    column-gap: 18px; row-gap: 2px;
    align-items: center; align-content: center;   /* sinon les trois lignes se
       repartissent sur toute la hauteur de la carte, et le nom flotte tout en
       haut pendant que le score tombe tout en bas */
    background: var(--carte); border-radius: 18px 18px 0 0;
    padding: 14px 22px 12px; border-top: 9px solid var(--medaille);
    box-shadow: 0 1px 0 rgba(14,20,32,.06);
    /* `flex: 1` et pas `height: 100%` : la carte prend la place qui reste
       APRÈS le socle. Avec la hauteur pleine, elle le poussait hors de la
       marche et le podium redevenait trois cartes alignées. */
    flex: 1;
  }

  /* La médaille suit le RANG : une marche = un rang = une couleur. Deux
     premiers ex æquo partagent la marche dorée, et il n'y a pas de deuxième
     marche ce jour-là. C'est la vérité sportive, et c'est lisible.
     Ce qui était vraiment en cause dans « le 2 devrait être gris », c'était la
     palette : l'argent tirait sur le bleu et l'or sur le bronze. */
  .groupe, .groupe .pod { --medaille: var(--bronze);
                          --medaille-encre: var(--bronze-encre); }
  .groupe.r1, .groupe.r1 .pod { --medaille: var(--or);
                                --medaille-encre: var(--or-encre); }
  .groupe.r2, .groupe.r2 .pod { --medaille: var(--argent);
                                --medaille-encre: var(--argent-encre); }
  .groupe.r3, .groupe.r3 .pod { --medaille: var(--bronze);
                                --medaille-encre: var(--bronze-encre); }
  .pod .place {
    grid-row: 1 / span 3; font-size: clamp(52px, 5.2vw, 96px); font-weight: 900; line-height: 1;
    color: var(--medaille-encre); text-align: center; font-variant-numeric: tabular-nums;
  }
  .pod .nom { font-size: clamp(24px, 2.2vw, 40px); font-weight: 800; letter-spacing: -0.02em;
              white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .pod .club { font-size: clamp(14px, 1.1vw, 20px); color: var(--encre2);
               white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  /* Le score, et lui seul. Le compte de blocs et l'écart au premier vivaient
     ici sans étiquette, à côté d'un score écrit deux fois plus gros : « 7 blocs
     −199 » se déchiffrait au lieu de se lire. Ils sont maintenant dans le
     tableau, deux lignes plus bas, sous un en-tête qui les nomme — et la
     largeur qu'ils prenaient revient au nom, qui en manquait dès que deux
     ex æquo se partagent une marche.

     `min-width: 0; overflow: hidden` reste, et reste utile : `nowrap` élargit
     la cellule au lieu de la rogner, ce qui suffisait à faire déborder la carte
     — c'est le défaut corrigé juste avant. Il ne reste qu'un nombre court à y
     tenir, mais la garde ne coûte rien. */
  .pod .chiffres { display: flex; align-items: baseline; margin-top: 4px;
                   flex-wrap: nowrap; white-space: nowrap;
                   min-width: 0; overflow: hidden; }
  .pod .score { font-size: clamp(32px, 3.2vw, 60px); font-weight: 900; line-height: 1;
                font-variant-numeric: tabular-nums; }

  /* ⚠️ PLUSIEURS EX ÆQUO SUR LA MÊME MARCHE.
     La largeur de la marche se divise entre les cartes — mais le MOBILIER de
     la carte ne se divisait pas : le gros numéro de place gardait ses 71 px,
     les marges leurs 44 px, le nom ses 28 px. Sur quatre ex æquo à 1280 px,
     il restait 163 px pour le nom, et « Delacroix-Martin Alexandre » en
     demande 217 : il sortait en « Delacroix-Martin … ».

     Le podium a une HAUTEUR FIXE (`clamp(150px, 23vh, 250px)`) : faire passer
     le nom sur deux lignes le ferait déborder par le bas. C'est donc le
     mobilier qui rétrécit, et le nom reste sur une ligne.

     Les paliers s'arrêtent à six : au-delà, `peindre()` supprime le podium et
     tout repasse au tableau. */
  .groupe.c2 .pod { column-gap: 13px; padding: 12px 16px 10px;
                    grid-template-columns: clamp(42px, 4.1vw, 72px) minmax(0, 1fr); }
  .groupe.c2 .pod .place { font-size: clamp(38px, 3.8vw, 68px); }
  .groupe.c2 .pod .nom   { font-size: clamp(20px, 1.7vw, 30px); }
  .groupe.c2 .pod .score { font-size: clamp(26px, 2.4vw, 44px); }
  .groupe.c2 .pod .club  { font-size: clamp(13px, 0.95vw, 17px); }

  .groupe.c3 .pod { column-gap: 10px; padding: 10px 13px 9px;
                    grid-template-columns: clamp(32px, 3.1vw, 54px) minmax(0, 1fr); }
  .groupe.c3 .pod .place { font-size: clamp(30px, 2.9vw, 52px); }
  .groupe.c3 .pod .nom   { font-size: clamp(17px, 1.4vw, 25px); }
  .groupe.c3 .pod .score { font-size: clamp(22px, 2vw, 36px); }
  .groupe.c3 .pod .club  { font-size: clamp(12px, 0.85vw, 15px); }

  .groupe.c4 .pod, .groupe.c5 .pod, .groupe.c6 .pod {
    column-gap: 8px; padding: 8px 11px 8px;
    grid-template-columns: clamp(26px, 2.5vw, 44px) minmax(0, 1fr); }
  .groupe.c4 .pod .place, .groupe.c5 .pod .place, .groupe.c6 .pod .place {
    font-size: clamp(24px, 2.3vw, 42px); }
  .groupe.c4 .pod .nom, .groupe.c5 .pod .nom, .groupe.c6 .pod .nom {
    font-size: clamp(15px, 1.2vw, 21px); }
  .groupe.c4 .pod .score, .groupe.c5 .pod .score, .groupe.c6 .pod .score {
    font-size: clamp(19px, 1.7vw, 30px); }
  /* À cinq cartes et plus, le club ne tient plus nulle part : le nom et le
     score valent mieux qu'une ligne de club illisible. */
  .groupe.c5 .pod .club, .groupe.c6 .pod .club { display: none; }
  .groupe.c4 .pod .club { font-size: clamp(11px, 0.8vw, 14px); }

  /* Les en-têtes vivent AU-DESSUS de la zone qui défile, pas dedans : dedans,
     ils repartaient avec le classement et revenaient d'un à-coup à la fin de la
     remontée. Un tableau garde ses titres sous les yeux, de toute façon. */
  #entetes { flex: none; display: grid; gap: 0 26px; margin-bottom: 2px; }
  #entetes:empty { display: none; }

  /* La zone qui défile doucement quand le plateau déborde. */
  #defile { flex: 1; min-height: 0; overflow: hidden; }
  /* Et qui CENTRE quand il ne la remplit pas. Vu en production le 31/08 sur la
     compétition de test : trois grimpeurs, trois lignes collées en haut, et
     les trois quarts du mur vides — ça se lit comme un écran cassé, pas comme
     une petite catégorie. Jamais quand ça déborde : le défilement doit partir
     du haut. */
  body.mur #defile.centre { display: flex; flex-direction: column; justify-content: center; }
  /* Quand ça défile, les lignes s'effacent aux deux bords au lieu d'être
     tranchées net : une ligne coupée en deux se lit comme un bogue
     d'affichage, un fondu se lit comme un mouvement voulu. */
  body.mur #defile.defilant {
    -webkit-mask-image: linear-gradient(to bottom, transparent 0, #000 26px,
                                        #000 calc(100% - 26px), transparent 100%);
    mask-image: linear-gradient(to bottom, transparent 0, #000 26px,
                                #000 calc(100% - 26px), transparent 100%);
  }
  body:not(.mur) #defile { overflow: visible; }
  /* ⚠️ `--grille-ligne` se déclare sur `main`, ET NULLE PART AILLEURS.
     C'est une propriété HÉRITÉE : elle se résout par élément, pas par cascade
     globale. `#liste` en portait sa propre valeur — et comme les lignes sont
     ses enfants alors que les en-têtes sont ceux de `#entetes`, les deux
     grilles n'ont jamais été la même. Le tableau et ses titres ont donc TOUJOURS
     été décalés : sur le mur, la colonne « Blocs » du titre faisait 27 px pour
     54 px de contenu (d'où « BLOC », rogné) ; sur téléphone, la ligne recevait
     cinq colonnes et l'en-tête six, et l'étoile, sans colonne, retombait à la
     ligne suivante.
     Effet de bord du même défaut : les largeurs en `--h` posées par la spec 016
     n'ont jamais atteint les lignes, qui sont restées sur les `em` que ces
     règles-ci figeaient. */
  #liste {
    display: flex; flex-direction: column; gap: 0;
    will-change: transform;
  }
  /* Le flux par LIGNES, et pas par colonnes. Le podium est une rangée (1, 2, 3
     de gauche à droite) : enchaîner sur des colonnes qui se lisent de haut en
     bas obligeait l'œil à changer de sens au milieu de l'écran. Maintenant tout
     se lit dans le même sens — 4, 5, 6 puis 7, 8, 9. */
  /* `.colonnes` est posée par `peindre()` dès qu'il y a plus d'une colonne :
     c'est elle qui porte les tableaux côte à côte HORS du mur. Le mur, lui,
     reste en grille même à une seule colonne — il y règle des hauteurs de
     ligne fixes, et faire passer sa boîte de flex à grille selon l'effectif
     ferait sauter le plateau à chaque bascule. */
  body.mur #liste, #liste.colonnes {
    display: grid; grid-template-columns: repeat(var(--colonnes, 3), 1fr);
    gap: 0 26px; align-content: start;
  }
  /* ⚠️ En mode mur, les colonnes d'une ligne se mesurent en `--h`, pas en `em`.
     Les `em` se calculent sur la police du CONTENEUR (16 px), alors que le
     contenu, lui, grandit avec `--h` : sur une catégorie de deux grimpeurs, où
     `--h` monte à 168 px, le score s'affichait en 67 px dans une colonne de
     83 px — « 1473 » y était coupé. C'est le défaut vu par Adrien sur U11 F, et
     c'est le même qui faisait que le tableau ne suivait pas un
     redimensionnement : la grille ne bougeait pas avec le texte. */
  body.mur main.d1, body.mur main.d2, body.mur main.d3 {
    /* `max(…, 2.4rem)` sur la colonne des blocs : c'est la plus étroite, et la
       seule qui n'arrivait pas à contenir son propre titre. Le titre cesse de
       rétrécir à 0,6 rem (son plancher) pendant que la colonne, elle, continue
       de suivre `--h` : sous 62 px de hauteur de ligne, « BLOCS » ne rentrait
       plus et sortait en « BLOC ». Un chiffre de blocs, lui, tient dans les
       27 px que `--h` donne — c'est bien le mot qu'il fallait loger. */
    --grille-ligne: calc(var(--h) * .85) minmax(0, 1fr) max(calc(var(--h) * .62), 2.4rem)
                    calc(var(--h) * 1.1) calc(var(--h) * 1.4);
  }
  body.mur main.d4 {
    --grille-ligne: calc(var(--h) * .8) minmax(0, 1fr) calc(var(--h) * 1.4);
  }

  /* Un TABLEAU, pas une pile de cartes. C'est ce que font les services de
     résultats sportifs, et pour une raison qui se mesure : des colonnes
     alignées se parcourent à la verticale, des cartes obligent à relire chaque
     ligne en entier. Zébrures très peu saturées (elles aident un peu la
     précision de lecture sans faire de bruit), chiffres tabulaires, texte à
     gauche et nombres à droite. */
  .entete {
    display: grid; align-items: end; gap: 12px;
    grid-template-columns: var(--grille-ligne);
    padding: 0 14px 6px; border-bottom: 2px solid var(--trait);
    font-size: 0.68rem; letter-spacing: 0.1em; text-transform: uppercase;
    font-weight: 700; color: var(--encre3, var(--encre2));
  }
  /* ⚠️ Plafonnée, et jamais débordante. Les titres grandissaient avec la
     hauteur de ligne — qui monte quand la catégorie est petite — pendant que
     les colonnes se resserraient avec la fenêtre : « GRIMPEUR » et « BLOCS »
     finissaient l'un sur l'autre. Vu par Adrien sur une catégorie à un seul
     grimpeur, dans une fenêtre étroite. */
  body.mur .entete { font-size: clamp(0.6rem, calc(var(--h, 64px) * .2), 1.05rem);
                     padding-bottom: 8px; }
  .entete span { overflow: hidden; white-space: nowrap; text-overflow: clip; }
  .entete span:nth-child(1), .entete span:nth-child(3),
  .entete span:nth-child(4), .entete span:nth-child(5) { text-align: right; }
  .entete span:nth-child(1) { text-align: left; }

  .ligne {
    display: grid; grid-template-columns: var(--grille-ligne);
    align-items: center; gap: 12px;
    padding: 9px 14px; border-bottom: 1px solid var(--trait);
  }
  .ligne:nth-of-type(even) { background: var(--zebre); }
  body.mur .ligne { height: var(--h, 64px); padding: 0 14px; }

  /* Le podium est marqué dans le tableau, TOUJOURS — le tableau le reprend
     désormais en entier. Sur le mur, c'est ce liseré qui relie la première
     ligne à la carte en or juste au-dessus ; sur un téléphone, où aucune marche
     n'est dessinée, c'est la seule chose qui dise que ces trois-là sont sur le
     podium. */
  .ligne.p1, .ligne.p2, .ligne.p3 { background: var(--carte2); }
  .ligne.p1 { box-shadow: inset 5px 0 0 var(--or); }
  .ligne.p2 { box-shadow: inset 5px 0 0 var(--argent); }
  .ligne.p3 { box-shadow: inset 5px 0 0 var(--bronze); }

  /* ⚠️ `body.mur .ligne .X` et pas `body.mur .X`.
     `.nom`, `.club` et `.score` existent des DEUX côtés : sur une ligne de
     tableau et sur une carte de podium. Sans `.ligne`, ces règles-ci
     l'emportaient sur `.pod .nom` — même nombre de classes, mais un `body` en
     plus — et une carte de podium se dessinait donc à la taille d'une ligne de
     tableau. Elle valait 16,72 px là où la carte demandait 40 : le podium était
     réglé sur la hauteur du classement, pas sur la sienne, depuis la spec 016.
     Invisible tant que TOUTES les cartes tombaient dedans ; flagrant depuis que
     `.groupe.cN` en sort les marches à plusieurs ex æquo, et qu'une marche à
     une seule carte se retrouvait deux fois plus petite que sa voisine. */
  .rang { font-weight: 800; color: var(--encre2); text-align: right;
          font-variant-numeric: tabular-nums; font-size: 1.15rem; }
  body.mur .ligne .rang { font-size: calc(var(--h, 64px) * .40); }
  .qui { min-width: 0; }
  .nom { font-weight: 700; font-size: 1.05rem;
         white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  body.mur .ligne .nom { font-size: calc(var(--h, 64px) * .38); }
  .club { color: var(--encre2); font-size: 0.8rem;
          white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  body.mur .ligne .club { font-size: calc(var(--h, 64px) * .21); }
  .score { font-weight: 800; font-size: 1.2rem; font-variant-numeric: tabular-nums;
           text-align: right; }
  body.mur .ligne .score { font-size: calc(var(--h, 64px) * .40); }
  .blocs { color: var(--encre2); font-size: 0.9rem; text-align: right;
           font-variant-numeric: tabular-nums; }
  body.mur .ligne .blocs { font-size: calc(var(--h, 64px) * .28); }
  /* L'écart au premier : la deuxième colonne que tout service de résultats
     affiche, après la position. « 1287 » ne dit rien seul ; « 1287, à −368 »
     dit la course. */
  .ecart { color: var(--encre2); text-align: right; font-variant-numeric: tabular-nums;
           font-size: 0.9rem; }
  body.mur .ligne .ecart { font-size: calc(var(--h, 64px) * .28); }

  /* Une place gagnée ou perdue se VOIT : la flèche dit de combien, la ligne
     glisse jusqu'à sa nouvelle place, et celui qui monte pulse une fois. */
  /* La densité : quand une colonne se resserre, on ENLÈVE de l'information
     plutôt que de tout tronquer. Dans l'ordre de ce qu'on peut perdre : le
     numéro de dossard (il est sur le dossard, justement), puis le club, puis
     le compte de blocs. Le nom et le score, jamais. */
  main.d4 .blocs, main.d4 .ecart, #podium.serre .club { display: none; }
  .club:empty { display: none; }
  /* En deux lignes, l'en-tête n'annonce plus que ce qui reste. */
  main.d4 .entete span:nth-child(3), main.d4 .entete span:nth-child(4) { display: none; }

  /* Les favoris du spectateur. Une colonne d'étoiles en plus, à droite, et
     seulement sur téléphone : sur le mur, personne ne touche l'écran. */
  /* ⚠️ `rem`, et surtout PAS `em`. `--grille-ligne` est héritée, mais ses `em`
     se résolvent sur l'élément QUI S'EN SERT : 16 px pour une ligne, 10,88 px
     pour un en-tête (`0.68rem`). La même valeur donnait donc deux grilles
     différentes — 38 px de colonne « Rang » sur la ligne, 26 px sur son titre,
     qui sortait en « RAN » — et les titres ne se posaient pas au-dessus de ce
     qu'ils nomment. En `rem`, les deux se résolvent sur la racine et tombent
     l'une sur l'autre. Le mur n'a jamais eu le défaut : ses colonnes sont en
     `calc(var(--h) * …)`, une longueur absolue. */
  body:not(.mur) main { --grille-ligne: 2.6rem minmax(0, 1fr) 4.6rem 2.4rem; }
  body:not(.mur) main.d1 { --grille-ligne: 3.4rem minmax(0, 1fr) 3.4rem 4.4rem 5.2rem 2.4rem; }
  body:not(.mur) main.d2 { --grille-ligne: 3.2rem minmax(0, 1fr) 3.2rem 4.2rem 5rem 2.4rem; }
  body:not(.mur) main.d3 { --grille-ligne: 3rem minmax(0, 1fr) 3rem 4rem 4.8rem 2.4rem; }
  body:not(.mur) main.d4 { --grille-ligne: 2.4rem minmax(0, 1fr) 4.4rem 2.4rem; }
  body.mur .etoile { display: none; }

  .etoile {
    cursor: pointer; background: none; border: 0; padding: 6px 2px;
    font-size: 1.35rem; line-height: 1; color: var(--trait);
    -webkit-tap-highlight-color: transparent;
  }
  .etoile[aria-pressed="true"] { color: var(--or); }
  .etoile:focus-visible { outline: 2px solid var(--accent, var(--groupe)); border-radius: 6px; }

  /* Un favori se repère sans être cherché : un filet à gauche et son étoile. */
  .ligne.favori { background: color-mix(in srgb, var(--groupe) 12%, var(--carte)); }
  .ligne.favori { box-shadow: inset 5px 0 0 var(--groupe); }
  .ligne.favori.p1 { box-shadow: inset 5px 0 0 var(--or); }
  .ligne.favori.p2 { box-shadow: inset 5px 0 0 var(--argent); }
  .ligne.favori.p3 { box-shadow: inset 5px 0 0 var(--bronze); }

  /* Une catégorie qui contient un favori le dit dans la barre. */
  #barre button .marqueur { color: var(--or); margin-right: 6px; }

  .fleche { font-size: 0.62em; font-weight: 800; margin-left: 8px; }
  .monte { color: var(--ok); }
  .descend { color: var(--alerte); }
  .pulse { animation: pulse 1600ms ease-out; }
  @keyframes pulse {
    0%   { background: color-mix(in srgb, var(--groupe) 30%, var(--carte)); }
    100% { background: var(--carte); }
  }

  #message { text-align: center; color: var(--encre2); padding: 50px 24px;
             font-size: 1.05rem; line-height: 1.6; }
  /* Vide, il mangeait quand meme 130 px de haut -- soit deux lignes de
     classement volees a l'ecran projete, en permanence. */
  #message:empty { display: none; }
  #message strong { color: var(--encre); display: block; font-size: 1.3rem;
                    margin-bottom: 8px; }
  body.mur #message { font-size: 1.6rem; }
  body.mur #message strong { font-size: 2.2rem; }

  /* Le telephone d'un parent, tenu a bout de bras. Le bandeau du mode mur y
     deborde : il passe en deux lignes plutot que de rogner le nom de la
     competition ou de pousser une barre de defilement horizontale. */
  @media (max-width: 900px) {
    .meta { white-space: normal; }
    header { padding: 12px 20px 10px; gap: 12px; }
  }

  /* Sous 520 px, le compteur du jour saute : trois lignes de bandeau volent
     deux lignes de classement, et c'est le classement qu'on est venu voir. */
  @media (max-width: 520px) {
    #reussites { display: none; }
  }

  @media (max-width: 680px) {
    header { flex-wrap: wrap; gap: 8px 12px; padding: 12px 16px 10px; }
    .logo { height: 34px; }
    .titre-groupe { font-size: 1.5rem; }
    #compte { font-size: 0.85rem; }
    .droite { width: 100%; margin-left: 0; text-align: left; }
    #competition { font-size: 0.95rem; }
    .meta { white-space: normal; }
    #barre { padding: 10px 16px; }
    #recherche { margin: 10px 16px 0; width: calc(100% - 32px); }
    main { padding: 12px 16px 24px; }
  }

  @media (prefers-reduced-motion: reduce) {
    * { animation: none !important; transition: none !important; }
  }

  /* ======================================================================
     LA FICHE DU GRIMPEUR, ET LE MUR — spec 026.

     Tout ce bloc est prefixe `sf-` (suivi/fiche). Ce n'est pas de la
     coquetterie : cette feuille porte deja le style de l'application ET celui
     du contenu, et deux collisions y ont ete payees. Un nom generique pris
     deux fois s'applique aux deux, en silence, et le defaut ne ressemble pas a
     sa cause.
     ====================================================================== */

  .sf-voile { position: fixed; inset: 0; background: rgba(9, 13, 20, .42);
              z-index: 40; }
  .sf-feuille {
    position: fixed; left: 0; right: 0; bottom: 0; top: 8vh; z-index: 41;
    display: flex; flex-direction: column; overflow: hidden;
    background: var(--carte); color: var(--encre);
    border: 1px solid var(--trait); border-bottom: 0;
    border-radius: 18px 18px 0 0;
    box-shadow: 0 -14px 44px -20px rgba(9, 13, 20, .55);
    /* La barre d'accueil de l'iPhone mange le dernier bloc sans ca. */
    padding-bottom: env(safe-area-inset-bottom, 0);
  }
  @media (min-width: 760px) {
    .sf-feuille { left: 50%; right: auto; transform: translateX(-50%);
                  width: 660px; top: 6vh; bottom: 6vh; border-radius: 16px;
                  border-bottom: 1px solid var(--trait); }
  }
  .sf-poignee { width: 40px; height: 4px; border-radius: 2px; flex: none;
                background: var(--trait); margin: 8px auto 0; }

  /* Les deux vues glissent l'une sur l'autre. La fiche RESTE montee sous le
     mur : y revenir doit etre un retour, pas un rechargement. */
  .sf-pile { flex: 1; min-height: 0; display: flex; width: 200%;
             transition: transform 320ms cubic-bezier(.32,.72,.28,1); }
  .sf-pile.au-mur { transform: translateX(-50%); }
  .sf-vue { width: 50%; display: flex; flex-direction: column; min-height: 0; }

  .sf-tete { display: grid; grid-template-columns: auto minmax(0,1fr) auto;
             align-items: center; gap: 14px; padding: 12px 18px; flex: none;
             border-bottom: 1px solid var(--trait); }
  .sf-dossard { font-size: 2.3rem; font-weight: 850; line-height: .9;
                letter-spacing: -.04em; color: var(--groupe);
                font-variant-numeric: tabular-nums; }
  .sf-dossard small { display: block; font-size: .55rem; font-weight: 700;
                      letter-spacing: .14em; text-transform: uppercase;
                      color: var(--encre3, var(--encre2)); margin-bottom: 3px; }
  .sf-qui b { display: block; font-size: 1.2rem; font-weight: 800;
              letter-spacing: -.02em; line-height: 1.15; }
  .sf-qui span { display: block; color: var(--encre2); font-size: .82rem; }
  .sf-rond { width: 40px; height: 40px; flex: none; border-radius: 50%;
             border: 1px solid var(--trait); background: var(--carte);
             color: var(--encre2); font: inherit; font-size: 1.05rem;
             line-height: 1; display: grid; place-items: center; cursor: pointer;
             padding: 0; }
  .sf-rond:hover { background: var(--carte2); color: var(--encre); }
  .sf-rond:focus-visible { outline: 2px solid var(--groupe); outline-offset: 2px; }

  .sf-rang { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap;
             padding: 11px 18px; background: var(--carte2); flex: none;
             border-bottom: 1px solid var(--trait); }
  .sf-rang .grand { font-size: 1.4rem; font-weight: 850; letter-spacing: -.03em;
                    font-variant-numeric: tabular-nums; }
  .sf-rang .ou { font-weight: 700; color: var(--groupe); font-size: .9rem; }
  .sf-rang .pts { margin-left: auto; text-align: right; }
  .sf-rang .pts b { font-size: 1.2rem; font-weight: 850;
                    font-variant-numeric: tabular-nums; }
  .sf-rang .pts span { display: block; font-size: .71rem; color: var(--encre2);
                       font-variant-numeric: tabular-nums; }
  .sf-ailleurs { padding: 7px 18px; font-size: .75rem; color: var(--encre2);
                 background: var(--carte2); flex: none;
                 border-bottom: 1px solid var(--trait); }
  .sf-ailleurs b { color: var(--encre); font-weight: 700; }

  .sf-corps { padding: 14px 18px 22px; overflow-y: auto; flex: 1; min-height: 0;
              -webkit-overflow-scrolling: touch; }
  .sf-avance { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .sf-avance h2 { margin: 0; font-size: .98rem; font-weight: 800;
                  letter-spacing: -.01em; }
  .sf-avance em { font-style: normal; margin-left: auto; font-size: .8rem;
                  color: var(--encre2); font-variant-numeric: tabular-nums; }
  .sf-vers-mur { font: inherit; font-size: .78rem; font-weight: 700;
                 cursor: pointer; border: 1px solid var(--trait);
                 background: var(--carte); color: var(--groupe);
                 border-radius: 999px; padding: 5px 11px; white-space: nowrap; }
  .sf-vers-mur:hover { background: var(--carte2); }
  .sf-vers-mur:focus-visible { outline: 2px solid var(--groupe); outline-offset: 2px; }
  .sf-jauge { height: 7px; border-radius: 4px; background: var(--carte2);
              margin-top: 9px; overflow: hidden; }
  .sf-jauge i { display: block; height: 100%; background: var(--ok);
                border-radius: 4px; }

  .sf-couleurs { margin-top: 15px; display: flex; flex-direction: column; gap: 13px; }
  .sf-couleur-tete { display: flex; align-items: center; gap: 8px;
                     font-size: .78rem; font-weight: 700; color: var(--encre2);
                     margin-bottom: 6px; }
  .sf-couleur-tete i { width: 12px; height: 12px; border-radius: 50%; flex: none;
                       border: 1px solid rgba(0,0,0,.22); }
  .sf-couleur-tete em { font-style: normal; margin-left: auto;
                        color: var(--encre3, var(--encre2)); font-size: .74rem;
                        font-variant-numeric: tabular-nums; }
  /* `auto-fit` comme sur le papier : un circuit de cinquante blocs resserre ses
     cases au lieu de deborder. */
  .sf-cases { display: grid; grid-template-columns: repeat(auto-fit, minmax(54px, 1fr));
              gap: 6px; }

  /* Une case porte la ZONE au-dessus et le NUMERO en gros : exactement ce que
     le grimpeur a sur son papier. Et 46 px de haut, parce que c'est une
     commande qu'on touche avec un pouce. */
  .sf-case { min-height: 46px; border: 1px solid var(--trait); border-radius: 9px;
             padding: 4px 2px; text-align: center; line-height: 1.05;
             background: var(--carte); color: var(--encre3, var(--encre2));
             font: inherit; display: flex; flex-direction: column;
             align-items: center; justify-content: center;
             -webkit-tap-highlight-color: transparent; }
  button.sf-case { cursor: pointer; }
  .sf-case .z { font-size: .62rem; font-weight: 600; letter-spacing: .04em; }
  .sf-case .n { font-size: .94rem; font-weight: 800;
                font-variant-numeric: tabular-nums; }
  .sf-case.reste { border-style: dashed; }
  .sf-case.grimpe { background: var(--ok); border-color: var(--ok); color: var(--carte); }
  .sf-case.grimpe .z { opacity: .75; }
  /* Credite par la cascade : HACHURE, pas en aplat. Meme convention que la
     spec 025, et lisible sans distinguer les teintes. */
  .sf-case.credite { border-color: var(--ok); color: var(--ok);
    background: repeating-linear-gradient(45deg,
      color-mix(in srgb, var(--ok) 34%, var(--carte)) 0 3px,
      color-mix(in srgb, var(--ok) 6%, var(--carte)) 3px 7px); }
  .sf-case:focus-visible { outline: 2px solid var(--groupe); outline-offset: 2px; }
  .sf-manque { margin: 14px 0 0; padding: 10px 12px; border-radius: 9px;
               background: var(--carte2); color: var(--encre2); font-size: .84rem; }

  /* --- Le mur ------------------------------------------------------------ */
  .sf-mur-tete { display: flex; align-items: center; gap: 12px; flex: none;
                 padding: 11px 14px 11px 10px; border-bottom: 1px solid var(--trait); }
  .sf-mur-tete b { display: block; font-size: 1rem; font-weight: 800; }
  .sf-mur-tete span { display: block; font-size: .75rem; color: var(--encre2); }
  .sf-carte { background: var(--fond); border: 1px solid var(--trait);
              border-radius: 12px; padding: 12px 10px; }
  .plan { display: block; width: 100%; height: auto; }

  /* Le REMPLISSAGE dit le profil du pan, et rien d'autre. Du froid au chaud au
     moment ou le mur passe la verticale : c'est la seule frontiere qui compte
     pour un grimpeur. Echelle ORDONNEE, elle ne se confond donc pas avec les
     six couleurs de difficulte, qui sont categorielles. */
  .plan { --pf-dalle: #D2E0E7; --pf-vertical: #A6C4D3; --pf-incline: #F0D5A0;
          --pf-devers: #EEBC7E; --pf-surplomb: #E7A074; --pf-toit: #E28379;
          --pl-contour: #FFFFFF; --pl-trame: rgba(20,28,36,.17);
          --pl-lettre: #16232E; --pl-halo: rgba(255,255,255,.92);
          --pl-anneau: #B5791B; --pl-lueur: #E0A94A; --pl-efface: .5; }
  body.sombre .plan {
          --pf-dalle: #2E3F4C; --pf-vertical: #3D6076; --pf-incline: #9A7238;
          --pf-devers: #B57430; --pf-surplomb: #BE5B33; --pf-toit: #BC443F;
          --pl-contour: #12131A; --pl-trame: rgba(255,255,255,.13);
          --pl-lettre: #F5F0E7; --pl-halo: rgba(9,10,14,.85);
          --pl-anneau: #FFD489; --pl-lueur: #FFC463; --pl-efface: .42; }

  .plan .contour { fill: none; stroke: var(--encre3, var(--encre2));
                   stroke-width: .9; stroke-dasharray: 3 3; opacity: .5; }
  .plan .mur { stroke: var(--pl-contour); stroke-width: .9; stroke-linejoin: round; }
  .plan .mur[data-profil], .plan g[data-profil="dalle"] .mur { fill: var(--pf-vertical); }
  .plan g[data-profil="dalle"] .mur    { fill: var(--pf-dalle); }
  .plan g[data-profil="vertical"] .mur { fill: var(--pf-vertical); }
  .plan g[data-profil="incline"] .mur  { fill: var(--pf-incline); }
  .plan g[data-profil="devers"] .mur   { fill: var(--pf-devers); }
  .plan g[data-profil="surplomb"] .mur { fill: var(--pf-surplomb); }
  .plan g[data-profil="toit"] .mur     { fill: var(--pf-toit); }
  .plan .trame { pointer-events: none; stroke: none; fill: none; }

  /* Le halo sous la lettre n'est pas un ornement : sur une trame dense, une
     lettre sans halo devient illisible. `paint-order` peint le contour AVANT
     le remplissage — sans lui le halo mange la lettre au lieu de la porter. */
  .plan .lettre { font-family: var(--titre); font-weight: 800;
                  fill: var(--pl-lettre); text-anchor: middle;
                  dominant-baseline: central; paint-order: stroke fill;
                  stroke: var(--pl-halo); }
  .plan .repere-plan { font-family: var(--titre); font-style: italic;
                       font-size: 4.6px; text-anchor: middle;
                       fill: var(--encre2); }

  /* L'ETAT est une emphase, jamais un aplat : un aplat mangerait la trame du
     profil, et il la mangerait sur les zones qui concernent le grimpeur. */
  .plan g[data-zone] { opacity: var(--pl-efface); cursor: pointer;
                       transform-box: view-box; transition: opacity 180ms ease; }
  .plan g[data-zone].z-reste, .plan g[data-zone].z-finie { opacity: 1; }
  /* Les cadres passent APRES tous les murs : en SVG l'ordre de peinture est
     l'ordre du document, et les murs d'Annonay se touchent bord a bord. */
  .plan .cadre-zone { fill: none; stroke: none; pointer-events: none; }
  .plan .cadre-zone.z-finie { stroke: var(--ok); stroke-width: 1.6; }
  .plan .cadre-zone.visee { stroke: var(--pl-anneau); stroke-width: 2.2; }
  .plan g[data-zone].visee { filter: drop-shadow(0 0 2.5px var(--pl-lueur)); }
  .sf-anime .plan g[data-zone].visee {
    animation: sf-rebond 760ms cubic-bezier(.34,1.56,.64,1) both; }
  @keyframes sf-rebond {
    0%   { transform: scale(.74); filter: drop-shadow(0 0 0 var(--pl-lueur)); }
    45%  { transform: scale(1.20); filter: drop-shadow(0 0 10px var(--pl-lueur)); }
    68%  { transform: scale(.95); }
    84%  { transform: scale(1.06); }
    100% { transform: scale(1);   filter: drop-shadow(0 0 2.5px var(--pl-lueur)); }
  }

  .sf-legende { margin-top: 12px; display: flex; flex-wrap: wrap; gap: 8px 14px;
                font-size: .72rem; color: var(--encre2); align-items: center; }
  .sf-legende i { width: 14px; height: 14px; border-radius: 4px; flex: none;
                  border: 2px solid var(--ok); background: var(--carte2); }
  .sf-zone { margin-top: 18px; padding-top: 14px; border-top: 1px solid var(--trait); }
  .sf-zone h3 { margin: 0 0 9px; font-size: .68rem; font-weight: 700;
                letter-spacing: .1em; text-transform: uppercase;
                color: var(--encre3, var(--encre2)); display: flex;
                align-items: baseline; gap: 8px; }
  .sf-compte { margin-left: auto; letter-spacing: 0; text-transform: none;
               font-size: .76rem; font-weight: 700; color: var(--encre2);
               font-variant-numeric: tabular-nums; }
  .sf-compte.finie { color: var(--ok); }
  .sf-note { margin: 12px 0 0; font-size: .76rem; color: var(--encre3, var(--encre2));
             line-height: 1.5; }

  /* Une ligne de classement s'ouvre. L'etoile des favoris garde son clic.
     ⚠️ `[data-archive=""]` : en rejeu d'archive, RIEN ne s'ouvre — la fiche ne
     parle que de la competition active (spec 026 § 3). Le curseur suit la
     regle plutot que de promettre un clic qui n'aura pas lieu. L'attribut est
     toujours present et vaut "" hors rejeu, d'ou le selecteur. */
  body:not(.mur)[data-archive=""] .ligne[data-participant],
  body:not(.mur)[data-archive=""] .pod[data-participant] { cursor: pointer; }

  @media (prefers-reduced-motion: reduce) {
    .sf-pile { transition: none; }
    .sf-anime .plan g[data-zone].visee { animation: none; }
  }
</style>
</head>
<body data-source="{{ source|default('/api/public/classement', true) }}"
      data-archive="{{ archive_libelle|default('', true) }}">

<header>
  <img class="logo" src="/static/logo-club.png" alt="" aria-hidden="true">
  <div class="titre-groupe"><span class="pastille"></span><span id="titreGroupe">Résultats</span></div>
  <span id="compte"></span>
  <div class="droite">
    <div id="competition"></div>
    <div class="meta">
      <span id="horloge"></span>
      <span id="fraicheur">chargement…</span>
      <span id="reussites"></span>
    </div>
    <div id="suivant"></div>
  </div>
  <button id="masquerRecherche" class="commande hors-mur" type="button"
          aria-pressed="false" aria-label="Masquer la recherche">⌕</button>
  <!-- ⚠️ `aria-pressed` est pose DES LE DEPART, comme sur le bouton voisin.
       Sans lui, un lecteur d'ecran annonce « bouton » et non « bouton a bascule,
       non active » : rien ne dit que la rotation TOURNE, ni qu'on peut l'arreter.
       L'attribut n'apparaissait qu'au premier clic -- le seul moment ou il
       n'apprend plus rien. Les deux boutons de cet en-tete sont des bascules ;
       ils se comportaient differemment. -->
  <button id="pause" class="commande partout" type="button"
          aria-pressed="false"
          aria-label="Mettre la rotation en pause">⏸</button>
</header>

<div id="barre" role="group" aria-label="Catégories"></div>
<input id="recherche" type="search" placeholder="Chercher un nom ou un dossard…"
       autocomplete="off" aria-label="Chercher un grimpeur">

<main>
  <div id="attente" hidden></div>
  <div id="podium"></div>
  <div id="entetes"></div>
  <div id="defile"><div id="liste"></div></div>
  <div id="message"></div>
</main>

<!-- ⚠️ `tojson` et JAMAIS `|safe` sur un `json.dumps`. `json.dumps` n'echappe
     pas « < » : un « </script> » dans un libelle de repere fermerait ce bloc et
     la suite deviendrait du balisage vivant, sur une page publique servie a
     tous les spectateurs. Depuis la spec 029 le plan est de la donnee SAISIE
     depuis la console. `tojson` echappe < > & ' en \u003c. -->
<script type="application/json" id="plan-du-mur">{{ plan|tojson }}</script>

<script type="module">
// ⚠️ Module, et non script classique : la logique du podium vit dans un
// fichier a part pour etre testable (`tests/js/podium.test.mjs`). Aucune
// consequence sur la page -- elle ne porte aucun gestionnaire en ligne,
// et le script suit deja tout le balisage.
import { selectionDuPodium, marchesDuPodium }
  from "/static/resultats/podium.js";
// La fiche du grimpeur (spec 026). La LOGIQUE vit dans ces deux modules pour
// etre testable sans navigateur (`tests/js/suivi.test.mjs`, `plan.test.mjs`) ;
// ce qui suit n'est que du branchement au DOM.
import { blocsDeZone, compteDeZone, ecrireDiese, etatsDesZones, lireDiese }
  from "/static/resultats/suivi.js";
import { decorer, decrire, monter, peutDessiner, zonesDe }
  from "/static/resultats/plan.js";
(function () {
  "use strict";

  // Les six couleurs de circuit, attribuées aux groupes dans l'ordre. C'est
  // ce qui rend un changement de catégorie visible avant d'être lu.
  var COULEURS = ["var(--c1)","var(--c2)","var(--c3)","var(--c4)","var(--c5)","var(--c6)"];

  var params = new URLSearchParams(location.search);
  var MUR = params.has("mur");
  var SOMBRE = params.has("sombre");

  // La source des donnees. La page publique lit le classement en direct ; la
  // consultation d'une archive lit un classement fige, servi par la console
  // (spec 018). Un seul `fetch` dans tout ce fichier : c'est ce qui rend le
  // rejeu possible sans dupliquer une seule ligne d'affichage.
  var SOURCE = document.body.dataset.source || "/api/public/classement";
  var ARCHIVE = document.body.dataset.archive || null;

  var PERIODE_MS = 15000;      // rafraîchissement des données
  var PERIME_MS = 60000;       // au-delà, l'âge passe en rouge
  // La rotation suit la TAILLE du plateau : le temps de lecture doit suivre ce
  // qu'il y a à lire. Une catégorie de 8 ne mérite pas les 30 s d'une de 26.
  // C'est le DÉFILEMENT qui commande le temps d'affichage, pas l'inverse
  // (Adrien, 01/09) : une catégorie reste à l'écran le temps de descendre et de
  // remonter en entier. Une catégorie qui tient d'un coup n'a rien à faire
  // défiler : elle reste le temps minimum.
  var VITESSE_DEFILEMENT = 55;      // px par seconde — la vitesse de lecture
  var ARRET_MS = 2500;              // les respirations, en haut et en bas
  var DUREE_MIN_MS = 10000;         // le plancher, pour une petite catégorie
  var ROTATION_FIXE_MS = parseFloat(params.get("rotation")) * 1000 || null;

  // Le mode mur ne montre que les classements SPORTIFS : catégories, circuits
  // et scratchs. Le cumul par club reste consultable sur téléphone — il bouge
  // peu et n'a pas sa place dans une boucle qu'on regarde toute la journée.
  var TYPES_MUR = ["categorie", "circuit", "scratch"];

  // Hauteur d'une ligne, en mode mur. En « large », on assume d'en montrer
  // moins : c'est le principe de la proposition.
  var MIN_H = 44, MAX_H = 124;
  // Sous ce nombre de lignes, on s'autorise plus grand : mieux vaut six lignes
  // hautes et lisibles de loin qu'un ruban de six lignes perdu sur un mur.
  // Une petite catégorie a droit à de plus grandes lignes, mais pas à des
  // lignes énormes : au-delà, un seul grimpeur occupait un quart de mur en
  // caractères de 67 px, ce qui se lit comme une erreur d'affichage.
  var PEU_DE_LIGNES = 6, MAX_H_PEU = 124;

  var etat = {
    classements: [],           // dernier classement CONNU. Jamais vidé sur erreur.
    competition: null,
    reussites: null,
    calculeLe: null,
    ageServeurS: 0,
    recuA: null,
    groupe: null,
    favoris: [],               // { id, nom, dossard } — stockage local du téléphone
    densite: 1,                // 1 = tout tient ; 4 = nom et score seulement
    groupes: [],               // les marches du podium, réutilisées
    enPanne: false,
    messageMetier: null,
    noeuds: {},                // participant -> élément, pour ANIMER au lieu de recréer
    rangs: {},                 // groupe -> { participant: rang } du rendu précédent
    deltas: {},
    minuteurRotation: null,
    dureeAffichage: 0,         // le temps que la catégorie reste à l'écran
    signatureDefilement: null, // ce qui justifie de relancer le défilement
    // La rotation tourne toute seule SUR LE MUR, et seulement là (choix
    // d'Adrien, 02/09) : un parent qui regarde la catégorie de son enfant sur
    // son téléphone ne doit pas la voir partir toute seule. Ailleurs le
    // bouton ▶ existe quand même, à l'arrêt : c'est lui qui transforme la
    // page normale en écran de projection.
    enPause: !MUR,             // la rotation, figée à la demande
    sansRecherche: false,      // le champ, masqué pour le vidéoprojecteur
    groupesMasques: [],        // les classements que la console ne veut pas montrer
    animationDefilement: null,
  };

  var el = {
    barre: document.getElementById("barre"),
    recherche: document.getElementById("recherche"),
    titre: document.getElementById("titreGroupe"),
    compte: document.getElementById("compte"),
    attente: document.getElementById("attente"),
    podium: document.getElementById("podium"),
    defile: document.getElementById("defile"),
    liste: document.getElementById("liste"),
    entetes: document.getElementById("entetes"),
    principal: document.querySelector("main"),
    message: document.getElementById("message"),
    fraicheur: document.getElementById("fraicheur"),
    horloge: document.getElementById("horloge"),
    reussites: document.getElementById("reussites"),
    competition: document.getElementById("competition"),
    suivant: document.getElementById("suivant"),
    pause: document.getElementById("pause"),
    masquerRecherche: document.getElementById("masquerRecherche"),
  };

  if (MUR) document.body.classList.add("mur");
  if (SOMBRE) document.body.classList.add("sombre");

  // --- Les favoris du spectateur ------------------------------------------
  //
  // Rangés dans le STOCKAGE LOCAL du téléphone, pas dans un cookie : un cookie
  // repart dans chaque requête HTTP — vers une page que soixante personnes
  // rafraîchissent toutes les quinze secondes — alors que ces noms n'ont rien à
  // faire sur le réseau. Ils ne quittent jamais l'appareil.
  //
  // La liste est liée à UNE compétition : les identifiants de participant sont
  // réattribués d'une édition à l'autre, et suivre « le n°12 » de l'an dernier
  // n'aurait aucun sens.

  var CLE_FAVORIS = "climbcontest.favoris";
  var GROUPE_FAVORIS = "★ Mes favoris";

  // --- Masquer la recherche (spec 020) --------------------------------------
  //
  // Le champ est indispensable sur le téléphone d'un parent et parasite sur un
  // mur. Il était déjà masqué en mode `?mur`, mais celui-ci emporte aussi la
  // rotation automatique et le grand format : on projette souvent sans.
  //
  // Le choix vit dans le STOCKAGE LOCAL, à côté des favoris et pour la même
  // raison : il ne regarde que cet appareil et n'a rien à faire sur le réseau.

  var CLE_AFFICHAGE = "climbcontest.affichage";

  function lireSansRecherche() {
    try {
      return JSON.parse(window.localStorage.getItem(CLE_AFFICHAGE) || "null")
             ?.sansRecherche === true;
    } catch (e) {
      // Navigation privée, stockage plein, JSON abîmé : le champ s'affiche, et
      // surtout la page continue de fonctionner.
      return false;
    }
  }

  function basculerRecherche(masquee) {
    etat.sansRecherche = masquee;
    document.body.classList.toggle("sans-recherche", masquee);
    el.masquerRecherche.setAttribute("aria-pressed", String(masquee));
    el.masquerRecherche.setAttribute(
      "aria-label", masquee ? "Afficher la recherche" : "Masquer la recherche");
    try {
      window.localStorage.setItem(CLE_AFFICHAGE,
                                  JSON.stringify({ sansRecherche: masquee }));
    } catch (e) { /* sans stockage, le choix ne dure que la visite */ }
  }

  function lireFavoris() {
    try {
      var brut = JSON.parse(window.localStorage.getItem(CLE_FAVORIS) || "null");
      if (!brut || !Array.isArray(brut.favoris)) return { competition: null, favoris: [] };
      return brut;
    } catch (e) {
      // Navigation privée, stockage plein, JSON abîmé : on n'a pas de favoris,
      // et surtout la page continue de fonctionner.
      return { competition: null, favoris: [] };
    }
  }

  function ecrireFavoris() {
    try {
      window.localStorage.setItem(CLE_FAVORIS, JSON.stringify({
        competition: etat.competition ? etat.competition.id : null,
        favoris: etat.favoris,
      }));
    } catch (e) { /* sans stockage, les favoris ne durent que la visite */ }
  }

  function chargerFavoris() {
    var range = lireFavoris();
    var id = etat.competition ? etat.competition.id : null;
    // Compétition différente : on repart de zéro plutôt que de suivre des
    // identifiants qui désignent quelqu'un d'autre.
    etat.favoris = (range.competition === id) ? range.favoris : [];
  }

  function estFavori(participant) {
    return etat.favoris.some(function (f) { return f.id === participant; });
  }

  function basculerFavori(l) {
    var participant = Number(l.participant_id);
    if (!participant) return;
    if (estFavori(participant)) {
      etat.favoris = etat.favoris.filter(function (f) { return f.id !== participant; });
    } else {
      etat.favoris.push({ id: participant, nom: l.nom, dossard: l.dossard });
    }
    ecrireFavoris();
    etat.noeuds = {};
    el.liste.innerHTML = "";
    dessiner();
  }

  /** Les lignes des favoris, prises dans leur CATÉGORIE — leur résultat
   *  officiel, celui du podium. */
  function lignesFavorites() {
    var lignes = [];
    etat.favoris.forEach(function (f) {
      var trouvee = null, groupe = null;
      etat.classements.forEach(function (c) {
        if (c.type !== "categorie" || trouvee) return;
        (c.lignes || []).forEach(function (l) {
          if (l.participant_id === f.id) { trouvee = l; groupe = c; }
        });
      });
      if (trouvee) {
        lignes.push({ cle: "fav-" + f.id, participant_id: f.id, rang: trouvee.rang,
                      score: trouvee.score, blocs: trouvee.blocs,
                      credites: trouvee.credites, nom: trouvee.nom,
                      club: trouvee.club, dossard: trouvee.dossard,
                      contexte: libelleDe(groupe) });
      } else {
        // Le favori n'est plus au classement (retiré, ou compétition changée) :
        // on le montre quand même, sinon on ne peut plus l'enlever.
        lignes.push({ cle: "fav-" + f.id, participant_id: f.id, rang: 0, score: 0,
                      blocs: 0, nom: f.nom, club: null, dossard: f.dossard,
                      contexte: "plus au classement" });
      }
    });
    return lignes;
  }

  function categoriesAvecFavori() {
    var avec = {};
    etat.classements.forEach(function (c) {
      (c.lignes || []).forEach(function (l) {
        if (estFavori(l.participant_id)) avec[c.groupe] = true;
      });
    });
    return avec;
  }

  /** La clé qui apparie une ligne à son nœud d'une repeinture à l'autre.
   *
   * ⚠️ Ce n'est PAS toujours `participant_id`. Le classement par club en donne
   * un pour tout le monde : `0` — un club n'est pas un participant. Les cinq
   * clubs se disputaient donc le même nœud, qui était déplacé de l'un à
   * l'autre : le classement des clubs n'affichait qu'UNE ligne, la dernière, et
   * depuis que le podium existe hors du mur, deux marches vides à côté d'une
   * troisième. Le nom fait l'affaire là où l'identifiant manque : c'est ce qui
   * identifie un club, et le classement est groupé dessus.
   */
  function cleDe(l) {
    return l.participant_id ? String(l.participant_id) : "nom:" + l.nom;
  }

  function sansMouvement() {
    return window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  }

  // --- Les groupes ----------------------------------------------------------

  function groupesVisibles() {
    var tous = MUR
      ? etat.classements.filter(function (c) {
          return TYPES_MUR.indexOf(c.type) !== -1;
        })
      : etat.classements;

    // Le réglage de la console (spec 020). Il s'applique PARTOUT — mur et
    // téléphones : une seule vérité, rien à expliquer le jour J.
    var masques = etat.groupesMasques || [];
    if (!masques.length) return tous;
    var restants = tous.filter(function (c) {
      return masques.indexOf(c.groupe) === -1;
    });

    // Tout masqué : on IGNORE le réglage. Une page vide se lit comme une
    // panne, et personne n'ira chercher le réglage en pleine compétition.
    return restants.length ? restants : tous;
  }

  function couleurDe(nomGroupe) {
    var i = etat.classements.findIndex(function (c) { return c.groupe === nomGroupe; });
    return COULEURS[(i < 0 ? 0 : i) % COULEURS.length];
  }

  function libelleDe(c) {
    if (c.type === "favoris") return GROUPE_FAVORIS;
    // « U13 » est un CIRCUIT : filles et garçons ensemble. Sans l'étiquette, il
    // se confond avec la catégorie « U13 F » qu'on vient d'afficher.
    return c.type === "circuit" ? c.groupe + " scratch"
         : c.type === "club" ? "Clubs" : c.groupe;
  }

  // --- Récupération ---------------------------------------------------------

  function charger() {
    fetch(SOURCE, { cache: "no-store" })
      .then(function (r) {
        if (r.status === 409) return r.json().then(function (d) { throw { metier: d.message }; });
        if (!r.ok) throw new Error("HTTP " + r.status);
        return r.json();
      })
      .then(function (d) {
        etat.classements = d.classements || [];
        etat.competition = d.competition || null;
        // Absent en mode archive : une archive se revoit en entier, elle fige
        // ce qu'elle fige.
        etat.groupesMasques = (etat.competition
                               && Array.isArray(etat.competition.groupes_masques))
          ? etat.competition.groupes_masques : [];
        etat.reussites = typeof d.reussites === "number" ? d.reussites : null;
        etat.calculeLe = d.calcule_le || null;
        etat.ageServeurS = typeof d.age_s === "number" ? d.age_s : 0;
        etat.recuA = Date.now();
        etat.enPanne = false;
        etat.messageMetier = null;
        if (!MUR) chargerFavoris();
        var visibles = groupesVisibles();
        if (!etat.groupe && visibles.length) etat.groupe = visibles[0].groupe;
        dessiner();
      })
      .catch(function (e) {
        // On NE VIDE PAS. Une page de résultats qui se vide parce qu'une
        // requête a échoué est pire qu'une page en retard : elle fait croire
        // que la compétition s'est arrêtée.
        if (e && e.metier) { etat.messageMetier = e.metier; etat.classements = []; }
        etat.enPanne = true;
        dessiner();
      });
  }

  // --- L'âge, l'heure, le compteur -----------------------------------------

  function majMeta() {
    var maintenant = new Date();
    el.horloge.textContent = maintenant.getHours() + "h"
      + String(maintenant.getMinutes()).padStart(2, "0");

    if (ARCHIVE) {
      // Les donnees sont figees : « calculé il y a 3 s » serait un mensonge,
      // et il vieillirait a l'ecran sans que rien ne change jamais.
      el.fraicheur.textContent = "· archive du " + ARCHIVE;
      el.fraicheur.className = "";
    } else if (etat.recuA === null) {
      el.fraicheur.textContent = etat.enPanne ? "· serveur injoignable" : "· chargement…";
    } else {
      var age = (etat.ageServeurS * 1000) + (Date.now() - etat.recuA);
      var s = Math.round(age / 1000);
      var texte = s < 20 ? "à l'instant"
                : s < 90 ? "il y a " + s + " s"
                : "il y a " + Math.round(s / 60) + " min";
      el.fraicheur.textContent = "· calculé " + texte;
      el.fraicheur.className = age > PERIME_MS || etat.enPanne ? "perime" : "";
      if (etat.enPanne) el.fraicheur.textContent = "· serveur injoignable, dernier classement " + texte;
    }

    el.reussites.textContent = etat.reussites === null ? ""
      : "· " + etat.reussites.toLocaleString("fr-FR")
        + (ARCHIVE ? " blocs validés" : " blocs validés aujourd'hui");
  }

  // --- Rendu ----------------------------------------------------------------

  function afficherMessage(titre, detail) {
    el.podium.classList.remove("visible");
    el.liste.innerHTML = "";
    etat.noeuds = {};
    el.attente.hidden = true;
    el.message.innerHTML = "";
    var t = document.createElement("strong");
    t.textContent = titre;
    el.message.appendChild(t);
    el.message.appendChild(document.createTextNode(detail));
  }

  function dessiner() {
    majMeta();
    el.competition.textContent = etat.competition ? etat.competition.nom : "";

    if (etat.messageMetier) {
      return afficherMessage("Pas de compétition en cours", etat.messageMetier);
    }
    if (!etat.classements.length) {
      return afficherMessage(
        etat.enPanne ? "Serveur injoignable" : "En attente des premiers résultats",
        etat.enPanne ? "La page réessaie toutes les 15 secondes."
                     : "Le classement s'affichera dès la première réussite enregistrée.");
    }
    el.message.textContent = "";

    var visibles = groupesVisibles();
    // « Mes favoris » n'est pas un classement du serveur : c'est une vue que la
    // page compose à partir des catégories. Il disparaît quand la liste se vide.
    var surFavoris = !MUR && etat.groupe === GROUPE_FAVORIS && etat.favoris.length > 0;
    var groupe = surFavoris
      ? { groupe: GROUPE_FAVORIS, type: "favoris", lignes: [] }
      : (visibles.find(function (c) { return c.groupe === etat.groupe; })
         || visibles[0] || etat.classements[0]);
    etat.groupe = groupe.groupe;
    document.documentElement.style.setProperty("--groupe", couleurDe(groupe.groupe));

    dessinerBarre();

    // Le champ masqué ne filtre plus rien, même si une valeur y traîne : une
    // liste filtrée sans champ visible serait indéchiffrable.
    var q = (MUR || etat.sansRecherche)
      ? "" : el.recherche.value.trim().toLowerCase();
    var lignes, titreTexte, compteTexte;

    if (q) {
      // La recherche traverse TOUTES les catégories : un parent qui cherche son
      // enfant ne connaît pas forcément sa catégorie — c'est même le cas le
      // plus fréquent.
      lignes = [];
      etat.classements.forEach(function (c) {
        (c.lignes || []).forEach(function (l) {
          if ((l.nom || "").toLowerCase().indexOf(q) !== -1
              || String(l.dossard || "").indexOf(q) !== -1) {
            lignes.push({ cle: c.groupe + "-" + cleDe(l),
                          participant_id: l.participant_id, rang: l.rang,
                          score: l.score, blocs: l.blocs, credites: l.credites,
                          nom: l.nom, club: l.club,
                          dossard: l.dossard, contexte: libelleDe(c) });
          }
        });
      });
      titreTexte = "Recherche";
      compteTexte = lignes.length + (lignes.length > 1 ? " résultats" : " résultat");
    } else if (surFavoris) {
      lignes = lignesFavorites();
      titreTexte = GROUPE_FAVORIS;
      compteTexte = lignes.length + (lignes.length > 1 ? " grimpeurs suivis"
                                                       : " grimpeur suivi");
    } else {
      // La catégorie, mais SEULEMENT sur un classement qui mélange les
      // catégories. Sur « U13 F », elle est déjà dans le titre : la répéter à
      // chaque ligne prendrait la place du club sans rien apprendre. Sur un
      // scratch — général ou par circuit — rien ne dit qui se compare à qui.
      // Demande d'Adrien, 01/09 : « sur les scratchs, tu m'affiches la
      // catégorie uniquement sur les scratchs ».
      var avecCategorie = groupe.type === "scratch" || groupe.type === "circuit";
      lignes = (groupe.lignes || []).map(function (l) {
        return { cle: cleDe(l), participant_id: l.participant_id,
                 rang: l.rang, score: l.score, blocs: l.blocs,
                 credites: l.credites, nom: l.nom, club: l.club, dossard: l.dossard,
                 contexte: avecCategorie ? (l.categorie || null) : null };
      });
      titreTexte = libelleDe(groupe);
      compteTexte = lignes.length + (lignes.length > 1 ? " grimpeurs" : " grimpeur");
    }

    el.titre.textContent = titreTexte;
    // ⚠️ Un signe sans légende est pire que pas de signe. La colonne « Blocs »
    // disparaît en densité 4 — le téléphone en deux lignes — et une infobulle
    // ne s'atteint ni au doigt ni sur un mur. La légende vit donc ici, et
    // seulement quand il y a vraiment des blocs crédités.
    if (lignes.some(function (l) { return l.credites; })) {
      compteTexte += " · * blocs crédités par la cascade de couleurs";
    }
    el.compte.textContent = compteTexte;
    majSuivant();

    // Personne n'a encore rien réussi : on l'annonce au lieu de laisser croire
    // à un classement figé. La liste reste affichée — voir les inscrits
    // rassure sur le fait que le système tourne.
    var toutAZero = lignes.length > 0 && lignes.every(function (l) { return !l.score; });
    el.attente.hidden = !toutAZero;
    if (toutAZero) {
      el.attente.textContent = "En attente des premières réussites — "
        + lignes.length + (lignes.length > 1 ? " grimpeurs inscrits" : " grimpeur inscrit")
        + ", aucun bloc validé pour l'instant.";
    }

    if (!lignes.length) {
      el.podium.classList.remove("visible");
      el.liste.innerHTML = "";
      etat.noeuds = {};
      return afficherMessage("Aucun grimpeur trouvé",
        q ? "Aucun nom ni dossard ne correspond à « " + q + " », dans aucune catégorie."
          : "Ce classement est vide pour l'instant.");
    }

    calculerDeltas(titreTexte, lignes);
    var avant = positions();
    // ⚠️ Ni pendant une recherche, ni sur « Mes favoris » : ces deux vues sont
    // composées de lignes prises dans DIX classements différents. Leurs rangs
    // ne se comparent pas entre eux — trois « 1er » de trois catégories y
    // feraient trois cartes d'or côte à côte, et un favori sorti du classement
    // (rang 0) une marche sans médaille. Le podium ne veut dire quelque chose
    // que sur un classement, et un seul.
    peindre(lignes, !q && !surFavoris);
    glisser(avant);
    programmerDefilement();
  }

  function prochainLibelle(visibles, groupe) {
    if (visibles.length < 2) return "";
    var i = visibles.findIndex(function (c) { return c.groupe === groupe.groupe; });
    return "ensuite : " + libelleDe(visibles[(i + 1) % visibles.length]);
  }

  // --- Les places gagnées ou perdues ---------------------------------------

  function calculerDeltas(cle, lignes) {
    var avant = etat.rangs[cle] || null;
    var apres = {};
    etat.deltas = {};
    lignes.forEach(function (l) {
      apres[l.cle] = l.rang;
      if (avant && avant[l.cle] && avant[l.cle] !== l.rang) {
        etat.deltas[l.cle] = avant[l.cle] - l.rang;   // > 0 : il MONTE
      }
    });
    etat.rangs[cle] = apres;
  }

  // --- L'animation : on déplace les lignes, on ne les recrée pas -----------

  function positions() {
    var p = {};
    Object.keys(etat.noeuds).forEach(function (cle) {
      var n = etat.noeuds[cle];
      if (n && n.isConnected) p[cle] = n.getBoundingClientRect();
    });
    return p;
  }

  function glisser(avant) {
    if (sansMouvement()) return;
    Object.keys(etat.noeuds).forEach(function (cle) {
      var n = etat.noeuds[cle], a = avant[cle];
      if (!n || !a || !n.isConnected) return;
      var b = n.getBoundingClientRect();
      var dx = a.left - b.left, dy = a.top - b.top;
      if (Math.abs(dx) < 1 && Math.abs(dy) < 1) return;
      n.animate([{ transform: "translate(" + dx + "px," + dy + "px)" },
                 { transform: "none" }],
                { duration: 650, easing: "cubic-bezier(.22,.75,.2,1)" });
    });
  }

  /** Un `div` de classe donnée, rattaché si on lui donne un parent.
   *
   * Les squelettes sont construits élément par élément, jamais par
   * `innerHTML` — même avec un littéral sans donnée. La règle « innerHTML ne
   * sert QU'À VIDER » se vérifie alors d'un coup d'œil, et un test la tient :
   * une règle qu'on ne peut pas vérifier mécaniquement finit contournée.
   */
  function div(classe, parent, balise) {
    var n = document.createElement(balise || "div");
    n.className = classe;
    if (parent) parent.appendChild(n);
    return n;
  }

  /** Une carte de podium : la place, le nom, le club, le score. Rien d'autre.
   *
   * Ni compte de blocs ni écart depuis que le tableau reprend le podium
   * (Adrien, 01/09) : ces deux nombres sont maintenant DEUX LIGNES PLUS BAS,
   * sous un en-tête qui les nomme. Sur la carte ils n'avaient pas d'étiquette
   * — « 7 blocs −199 » se déchiffre — et ils volaient au nom la largeur qui lui
   * manque justement quand plusieurs ex æquo se partagent une marche.
   */
  function noeudPodium() {
    var n = div("pod");
    div("place", n);
    div("nom", n);
    div("club", n);
    var chiffres = div("chiffres", n);
    div("score", chiffres, "span");
    return n;
  }

  /** Une marche : les cartes d'un même rang, et le socle qui les porte. */
  function noeudGroupe() {
    var g = div("groupe");
    div("cartes", g);
    div("socle", g);
    return g;
  }

  /** Une ligne de tableau : rang | grimpeur | blocs | écart | score | ★ */
  function noeudLigne() {
    var n = div("ligne");
    div("rang", n);
    var qui = div("qui", n);
    div("nom", qui);
    div("club", qui);
    div("blocs", n);
    div("ecart", n);
    div("score", n);
    if (!MUR) {
      var etoile = document.createElement("button");
      etoile.type = "button";
      etoile.className = "etoile";
      etoile.textContent = "★";
      n.appendChild(etoile);
    }
    return n;
  }

  /** L'en-tête de colonnes. Une par colonne affichée : sans elle, « 16 » et
   *  « −368 » sont deux nombres qu'on doit deviner. */
  function noeudEntete() {
    var n = div("entete");
    ["Rang", "Grimpeur", "Blocs", "Écart", "Score"].forEach(function (mot) {
      var s = document.createElement("span");
      s.textContent = mot;
      n.appendChild(s);
    });
    return n;
  }

  function remplir(n, l, tete) {
    var d = etat.deltas[l.cle];
    // ⚠️ Déclaré ICI, avant le premier usage. Il l'était vingt lignes plus bas :
    // `var` hissait le nom sans la valeur, et les trois tests de la ligne
    // d'appoint le lisaient donc `undefined`. Une carte de podium se remplissait
    // comme une ligne de tableau — club perdu en densité 3, dossard perdu
    // partout ailleurs qu'en densité 1, et « 7 blocs · −199 » recollé dans le
    // club en densité 4.
    var estPodium = n.classList.contains("pod");
    n.querySelector(".place, .rang").textContent = l.rang;

    var nom = n.querySelector(".nom");
    nom.textContent = l.nom || ("Dossard " + l.dossard);   // textContent, jamais innerHTML
    if (d) {
      var f = document.createElement("span");
      f.className = "fleche " + (d > 0 ? "monte" : "descend");
      f.textContent = (d > 0 ? " ▲" : " ▼") + Math.abs(d);
      nom.appendChild(f);
    }

    // Ce qu'on garde de la ligne d'appoint dépend de la place. Le texte est
    // recomposé, pas rogné : « Les Lezards Vagab… · n° » ne renseigne personne.
    // Densité 1 : tout. 2 : le dossard part (il est sur le dossard, justement).
    // 3 : le club part. 4 : la ligne entière part, et le compte de blocs avec.
    var appoint = [l.contexte];
    // Le club revient en densité 4 : la mise en deux lignes lui redonne la
    // place que le tableau serré lui refusait. Un parent cherche le club.
    if (etat.densite !== 3 || estPodium) appoint.push(l.club);
    if ((etat.densite <= 1 || estPodium) && l.dossard) appoint.push("n°" + l.dossard);
    if (etat.densite >= 4 && !estPodium) {
      // Les colonnes ont disparu : leur contenu revient ici plutôt que d'être
      // perdu. Une ligne de plus vaut mieux qu'une information de moins.
      appoint.push(l.blocs + (l.blocs > 1 ? " blocs" : " bloc")
                   + (l.credites ? "*" : ""));
      var perdu = (tete || 0) - l.score;
      if (perdu > 0) appoint.push("−" + perdu);
    }
    n.querySelector(".club").textContent = appoint.filter(Boolean).join(" · ");
    n.querySelector(".score").textContent = l.score;

    // Les colonnes chiffrées n'existent que dans le tableau : une carte de
    // podium n'a plus ni l'une ni l'autre.
    var blocs = n.querySelector(".blocs");
    if (blocs) {
      // ⚠️ Avec la cascade de couleurs (spec 025), ce nombre compte des blocs
      // que le grimpeur n'a PAS grimpés : réussir toute une couleur en valide
      // d'autres. Un astérisque le dit — la place manque pour la phrase, mais
      // « 36 blocs » sans rien serait faux devant quelqu'un qui l'a vu grimper.
      // Absent quand la cascade est éteinte, ce qui est le défaut.
      // L'infobulle ne s'atteint ni au doigt ni au vidéoprojecteur : c'est la
      // ligne de comptage, sous le titre, qui porte la légende de l'astérisque.
      blocs.textContent = l.blocs + (l.credites ? "*" : "");
      if (l.credites) {
        blocs.title = (l.blocs - l.credites) + " grimpé"
          + (l.blocs - l.credites > 1 ? "s" : "") + " · " + l.credites
          + " crédité" + (l.credites > 1 ? "s" : "") + " par la cascade de couleurs";
      } else {
        blocs.removeAttribute("title");
      }
    }

    // L'écart au premier : ce que tout service de résultats affiche juste après
    // la position. Le premier n'a pas d'écart — un « 0 » ferait croire à une
    // égalité avec lui-même ; un tiret garde la colonne alignée.
    var ecart = n.querySelector(".ecart");
    if (ecart) {
      var retard = (tete || 0) - l.score;
      ecart.textContent = retard > 0 ? "−" + retard : "—";
    }

    if (estPodium) {
      n.className = "pod";
      // Spec 026 F1 : « toucher une ligne — ou une carte du podium ». La carte
      // est la cible visuelle evidente au-dessus de 900 px ; sans cet
      // identifiant elle etait morte, et la regle CSS qui lui donne un curseur
      // ne s'appliquait jamais.
      if (l.participant_id) n.dataset.participant = l.participant_id;
      else delete n.dataset.participant;
    } else {
      var favori = !MUR && estFavori(Number(l.participant_id));
      // Le liseré de médaille, TOUJOURS. Il était supprimé dès que la page
      // pouvait montrer une marche — c'est-à-dire presque partout, y compris
      // sur un téléphone qui n'en affiche jamais : les trois premiers y
      // passaient inaperçus. Maintenant que le tableau reprend le podium, c'est
      // lui qui relie la ligne 1 à la carte en or juste au-dessus.
      n.className = "ligne"
        + (l.rang > 0 && l.rang <= 3 ? " p" + l.rang : "")
        + (favori ? " favori" : "");
      // L'identifiant sur la ligne : c'est par la que le clic retrouve le
      // grimpeur (spec 026). Une ligne de CLUB porte `participant_id = 0` et
      // n'a personne derriere -- elle reste donc muette.
      if (l.participant_id) n.dataset.participant = l.participant_id;
      else delete n.dataset.participant;
      var etoile = n.querySelector(".etoile");
      if (etoile) {
        etoile.setAttribute("aria-pressed", String(favori));
        etoile.setAttribute("aria-label",
          (favori ? "Retirer " : "Suivre ") + (l.nom || "ce grimpeur"));
        etoile.onclick = function (e) { e.stopPropagation(); basculerFavori(l); };
      }
    }

    if (d > 0 && !sansMouvement()) {
