      n.classList.remove("pulse"); void n.offsetWidth; n.classList.add("pulse");
    }
  }

  var LARGEUR_PODIUM = 900;      // en dessous, trois cartes côte à côte s'écrasent

  /** L'ordre des enfants de la liste : en-têtes et lignes, agencés selon le
   *  sens de lecture choisi. C'est ici, et nulle part ailleurs, que se décide
   *  « on lit en colonnes » ou « on lit en lignes ». */
  /** Les rangées d'en-tête, au-dessus du classement : une par colonne. */
  function poserEntetes(colonnes) {
    el.entetes.style.gridTemplateColumns = "repeat(" + colonnes + ", 1fr)";
    while (el.entetes.children.length > colonnes) {
      el.entetes.removeChild(el.entetes.lastChild);
    }
    while (el.entetes.children.length < colonnes) {
      el.entetes.appendChild(noeudEntete());
    }
  }

  function agencer(suite, colonnes) {
    var enfants = [];
    if (colonnes < 2) {
      el.liste.style.gridAutoFlow = "row";
      el.liste.style.gridTemplateRows = "";
      suite.forEach(function (l) { enfants.push({ ligne: l }); });
      return enfants;
    }

    // Chaque colonne est une tranche CONTINUE du classement, et son en-tête
    // annonce la tranche — « 4 → 10 ». Les rangs descendent, l'œil descend avec
    // eux ; et sans l'annonce, rien ne dirait dans quel sens lire.
    var parColonne = Math.ceil(suite.length / colonnes);
    el.liste.style.gridAutoFlow = "column";
    el.liste.style.gridTemplateRows = "repeat(" + parColonne + ", auto)";
    suite.forEach(function (l) { enfants.push({ ligne: l }); });
    return enfants;
  }

  function majEntete() {
    // L'en-tête dit ce que contient la colonne, pas où elle commence : la
    // tranche « 4 → 14 » n'apprenait rien que le premier rang de la colonne ne
    // dise déjà (Adrien, 01/09).
  }

  /** La clé de la CARTE d'un grimpeur, distincte de celle de sa ligne.
   *
   * Depuis que le tableau reprend le podium, un grimpeur des trois premiers
   * rangs a deux nœuds à l'écran : sa carte sur la marche, et sa ligne dans le
   * tableau. Sous une clé unique, chaque repeinte détruisait celui que l'autre
   * venait de créer — et le mouvement, qui ne déplace que les nœuds qui
   * survivent d'une repeinte à l'autre, ne partait jamais.
   */
  function clePodium(l) { return "pod:" + l.cle; }

  function peindre(lignes, avecPodium) {
    // ⚠️ Plus de `MUR &&` ici. Ce qui décide, c'est la PLACE : un podium tient
    // sur un portable de la salle comme sur le mur, et il ne tient sur aucun
    // téléphone. `avecPodium` reste faux pendant une recherche et sur les
    // favoris — un podium n'a de sens que sur UN classement.
    // ⚠️ Plus de `lignes.length > 3` non plus (Adrien, 02/09 : « même si le
    // podium n'est pas encore établi, il faut l'afficher »). Une catégorie de
    // deux grimpeurs a un podium — de deux marches, mais un podium. Et une
    // catégorie où personne n'a encore marqué en a un aussi : trois marches
    // vides, qui disent que la remise des prix n'a pas encore de gagnant,
    // là où l'absence de podium se lit comme un défaut d'affichage.
    var podium = avecPodium && window.innerWidth >= LARGEUR_PODIUM;
    el.podium.classList.toggle("visible", podium);
    el.podium.classList.toggle("serre", window.innerWidth < 1150);

    // L'écart se mesure au premier : les lignes sont déjà triées par rang.
    var meilleur = lignes.length ? lignes[0].score : 0;

    // Le podium prend TOUS ceux qui sont dans les trois premiers rangs, ex æquo
    // compris : ils sont à égalité, ils doivent être au même niveau. Au-delà de
    // six cartes, la marche devient illisible et tout repasse au tableau.
    // Qui monte, et le podium s'affiche-t-il : voir `podium.js`, ou les deux
    // regles delicates -- le filtre « a marque » et le masquage au-dela de six
    // ex aequo -- sont commentees et testees.
    var choix = selectionDuPodium(lignes, podium);
    podium = choix.podium;
    var tete = choix.tete;
    // Le tableau reprend TOUT LE MONDE, podium compris (Adrien, 01/09). Il
    // commençait au rang 4, et il fallait remonter les yeux à l'autre bout de
    // l'écran pour savoir ce qu'avait fait le premier — quand la marche le
    // disait encore, parce qu'à quatre ex æquo elle ne disait plus rien. Un
    // classement lisible se lit d'un bloc, de 1 à N ; la marche est le
    // projecteur qu'on braque dessus, pas un morceau qu'on lui retire.
    var suite = lignes;

    // Une marche par RANG : le premier au centre et plus haut, le deuxième à
    // gauche, le troisième à droite et plus bas. Les ex æquo partagent leur
    // marche — même hauteur, même médaille.
    // Une marche par RANG, trois toujours : voir `podium.js`. Un rang absent
    // n'est pas forcement libre -- les ex aequo en sautent.
    var marches = marchesDuPodium(tete, podium);

    marches.forEach(function (m, i) {
      var g = etat.groupes[i] || (etat.groupes[i] = noeudGroupe());
      // `cN` porte le NOMBRE d'ex æquo sur la marche : c'est lui qui fait
      // rétrécir le mobilier de la carte, sans quoi le nom est tronqué.
      g.className = "groupe place-" + Math.min(3, m.rang) + " r" + Math.min(3, m.rang)
                  + " c" + Math.min(6, Math.max(1, m.lignes.length))
                  + (m.vide ? " attente" : "");
      var cartes = g.querySelector(".cartes");
      m.lignes.forEach(function (l, j) {
        var carte = etat.noeuds[clePodium(l)];
        if (!carte) {
          carte = noeudPodium();
          etat.noeuds[clePodium(l)] = carte;
        }
        remplir(carte, l, meilleur);
        if (cartes.children[j] !== carte) {
          cartes.insertBefore(carte, cartes.children[j] || null);
        }
      });
      while (cartes.children.length > m.lignes.length) {
        cartes.removeChild(cartes.lastChild);
      }
      if (el.podium.children[i] !== g) {
        el.podium.insertBefore(g, el.podium.children[i] || null);
      }
    });
    while (el.podium.children.length > marches.length) {
      el.podium.removeChild(el.podium.lastChild);
    }

    // Plusieurs tableaux côte à côte DÈS QUE LA LARGEUR LES PORTE, sur le mur
    // comme ailleurs (Adrien, 01/09). Un classement de cent lignes sur une
    // seule colonne large de 1 800 px, c'est 1 500 px de blanc entre le nom et
    // le score, et neuf lignes visibles là où il en tient trente.
    var colonnes = colonnesPour(suite.length);
    el.liste.style.setProperty("--colonnes", colonnes);
    el.liste.classList.toggle("colonnes", colonnes > 1);

    var enfants = suite.length ? agencer(suite, colonnes) : [];
    // La hauteur de ligne d'abord, la densité ensuite : sur le mur, la seconde
    // se mesure en multiples de la première. Ailleurs, la ligne garde sa
    // hauteur naturelle et c'est la page qui défile.
    if (MUR) ajuster(Math.ceil(suite.length / colonnes), 1, false);
    regler_densite(colonnes);
    poserEntetes(suite.length ? colonnes : 0);

    enfants.forEach(function (item, index) {
      var n = etat.noeuds[item.ligne.cle];
      if (!n) {
        n = noeudLigne();
        etat.noeuds[item.ligne.cle] = n;
      }
      remplir(n, item.ligne, meilleur);
      if (el.liste.children[index] !== n) {
        el.liste.insertBefore(n, el.liste.children[index] || null);
      }
    });
    while (el.liste.children.length > enfants.length) {
      el.liste.removeChild(el.liste.lastChild);
    }

    // Les nœuds disparus (changement de groupe, recherche) sortent de la table.
    // Une carte sort aussi dès que son grimpeur quitte la marche, alors que sa
    // ligne, elle, reste : c'est ce qui fait qu'une descente du podium au rang 4
    // se voit glisser au lieu de clignoter.
    var vivants = {};
    lignes.forEach(function (l) { vivants[l.cle] = true; });
    tete.forEach(function (l) { vivants[clePodium(l)] = true; });
    Object.keys(etat.noeuds).forEach(function (cle) {
      if (!vivants[cle]) delete etat.noeuds[cle];
    });
  }

  /** Combien de colonnes : la largeur décide autant que l'effectif.
   *
   * Une fenêtre réduite à 700 px ne doit pas garder trois colonnes de 230 px —
   * un nom n'y tient plus. On prend donc le MINIMUM des deux contraintes, et on
   * recalcule à chaque redimensionnement.
   */
  // 430 px par colonne SUR LE MUR. Le tableau y coûte ~300 px de gabarit fixe
  // (rang, blocs, écart, score) : en dessous, il ne reste plus de place pour un
  // nom, et c'est le nom qu'on vient lire. Mieux vaut deux colonnes lisibles
  // que trois colonnes de « Nieuv… ».
  var MIN_COLONNE_MUR = 430;

  /** Ce que coûte une colonne, au minimum, pour qu'un nom y tienne encore.
   *
   * Hors du mur, ce n'est pas 430 px : le gabarit y porte une colonne DE PLUS —
   * l'étoile des favoris — et se mesure en `rem`, pas en multiples de la
   * hauteur de ligne. La réponse est déjà écrite plus bas, dans les deux
   * constantes dont `regler_densite()` se sert : le mobilier de la densité 1,
   * plus ce qu'il faut pour lire un nom. La recopier en dur, c'est se donner
   * rendez-vous avec une divergence — 389 + 140, et le jour où l'un des deux
   * bouge, l'autre non.
   */
  function minColonne() {
    if (MUR) return MIN_COLONNE_MUR;
    return COUT_TELEPHONE[1].rem * unRem() + COUT_TELEPHONE[1].px + LARGEUR_NOM;
  }

  function colonnesPour(nombre) {
    var largeur = el.liste.clientWidth || window.innerWidth;
    var parLargeur = Math.max(1, Math.min(3, Math.floor(largeur / minColonne())));
    var parNombre = nombre > 12 ? 3 : nombre > 4 ? 2 : 1;
    return Math.min(parLargeur, parNombre);
  }

  /** Ce qu'on affiche d'une ligne, selon la place qu'elle a.
   *
   * Adrien, 31/08 : « si tu dois supprimer des informations ou les
   * redimensionner ». C'est exactement ça — on ne tronque pas un nom de club
   * en « Les Lezards Vagab… », on l'enlève. Le nom et le score ne partent
   * jamais : ce sont les deux seules choses qu'on vient lire.
   */
  // Ce que coûtent les quatre colonnes chiffrées, en multiples de la hauteur de
  // ligne : rang .85 + blocs .62 + écart 1.1 + score 1.4. Sous 62 px de hauteur
  // de ligne, le plancher de 2,4 rem sur la colonne des blocs coûte une dizaine
  // de pixels de plus — trop peu pour changer une densité, et l'estimation reste
  // du bon côté : elle sous-évalue le coût de moins de 2 %.
  var COUT_CHIFFRES = 3.97;

  // Hors du mur, les mêmes colonnes se mesurent en `rem` — et il y en a une de
  // plus, l'étoile des favoris. Par densité : rang + blocs + écart + score +
  // étoile, puis les gouttières de 12 px et les 2 × 14 px de rembourrage de la
  // ligne. En deux lignes (densité 4), il ne reste que trois colonnes, donc
  // trois gouttières.
  var COUT_TELEPHONE = [null,
    { rem: 3.4 + 3.4 + 4.4 + 5.2 + 2.4, px: 5 * 12 + 28 },
    { rem: 3.2 + 3.2 + 4.2 + 5.0 + 2.4, px: 5 * 12 + 28 },
    { rem: 3.0 + 3.0 + 4.0 + 4.8 + 2.4, px: 5 * 12 + 28 },
    { rem: 2.4 + 4.4 + 2.4,             px: 3 * 12 + 28 }];

  // Mesuré au canevas, à la police et à la graisse de `.nom` : « Vialle Jade »
  // occupe 88 px, « Nieuviarts Martin » 139. En dessous de 140 px de colonne, un
  // nom de compétition ne tient plus — on replie le tableau en deux lignes
  // plutôt que de le tronquer. Les noms composés très longs (« Delacroix-Martin
  // Alexandre », 221 px) s'abrègent sur l'ellipse : un nom coupé se comprend.
  var LARGEUR_NOM = 140;

  /** Un `rem`, en pixels. Le lecteur qui grossit la police de son navigateur
   *  élargit d'autant le gabarit : les deux calculs qui s'en servent — la
   *  densité et le nombre de colonnes — doivent le lire, pas le supposer. */
  function unRem() {
    return parseFloat(getComputedStyle(document.documentElement).fontSize) || 16;
  }

  function regler_densite(colonnes) {
    var largeur = (el.liste.clientWidth - (colonnes - 1) * 26) / colonnes;
    if (!MUR) {
      // ⚠️ Les seuils portaient sur la largeur TOTALE et ignoraient et
      // l'étoile, et les gouttières, et le rembourrage. À 470 px de fenêtre, la
      // page choisissait donc la densité 3 en laissant 75 px au nom — « Vialle
      // Jade » en demande 88. On mesure maintenant ce qui reste vraiment au nom.
      var rem = unRem();
      etat.densite = 4;
      for (var d = 1; d <= 3; d++) {
        var cout = COUT_TELEPHONE[d];
        if (largeur - cout.rem * rem - cout.px >= LARGEUR_NOM) { etat.densite = d; break; }
      }
    } else {
      // Sur le mur, tout est proportionnel à la hauteur de ligne : la place qui
      // reste au nom se mesure donc DANS CETTE UNITÉ, pas en pixels. Une
      // catégorie d'un seul grimpeur a des lignes de 124 px, où les colonnes
      // chiffrées coûtent près de 500 px — ce qu'une fenêtre étroite ne peut
      // pas payer.
      var h = parseFloat(getComputedStyle(el.principal).getPropertyValue("--h")) || 48;
      var pourLeNom = (largeur - h * COUT_CHIFFRES) / h;
      // Un nom de seize lettres écrit en 0,38 h occupe environ 3 h. En dessous
      // de 1,8 h de colonne, il n'en reste plus assez pour lire un nom : on
      // replie le tableau en deux lignes plutôt que de tout tronquer.
      etat.densite = pourLeNom >= 2.2 ? 1 : pourLeNom >= 2 ? 2 : pourLeNom >= 1.8 ? 3 : 4;
    }
    for (var n = 1; n <= 4; n++) el.principal.classList.toggle("d" + n, n === etat.densite);
  }

  /** La hauteur d'une ligne, pour que la catégorie ENTIÈRE tienne à l'écran. */
  function ajuster(nombre, colonnes, entetes) {
    // La rangée d'en-têtes prend sa place : sans ça, la dernière ligne passe
    // sous le bord de l'écran.
    var lignes = Math.max(1, Math.ceil(nombre / colonnes)) + (entetes ? 0.75 : 0);
    var style = getComputedStyle(el.defile);
    // clientHeight INCLUT le rembourrage : sans cette soustraction, les
    // dernières lignes passent sous le bord de l'écran.
    var dispo = el.defile.clientHeight
              - parseFloat(style.paddingTop) - parseFloat(style.paddingBottom);
    var h = Math.floor((dispo - (lignes - 1) * 7) / lignes);
    var plafond = lignes <= PEU_DE_LIGNES ? MAX_H_PEU : MAX_H;
    el.principal.style.setProperty("--h", Math.max(MIN_H, Math.min(plafond, h)) + "px");
  }

  /** Quand le plateau déborde malgré tout, il DÉFILE — doucement, en boucle. */
  function programmerDefilement() {
    // ⚠️ On ne relance PAS une animation qui court déjà sur le même plateau.
    //
    // Les données sont rafraîchies toutes les quinze secondes, et chaque
    // rafraîchissement repeint. En recréant l'animation à chaque fois, le
    // défilement repartait du haut avant d'avoir eu le temps de remonter : la
    // remontée n'arrivait jamais. C'est le défaut vu par Adrien le 01/09.
    //
    // La signature dit ce qui, seul, justifie de repartir de zéro : un autre
    // classement, un débordement franchement différent, une autre durée.
    var trop = el.liste.scrollHeight - el.defile.clientHeight;
    var deborde = trop > 8 && MUR && !sansMouvement();

    el.defile.classList.toggle("centre", trop <= 8);
    el.defile.classList.toggle("defilant", deborde);

    // Le temps d'affichage DÉCOULE d'ici : descente + remontée + les trois
    // respirations. Une catégorie qui tient à l'écran garde le plancher.
    var course = deborde ? (trop / VITESSE_DEFILEMENT) * 1000 : 0;
    etat.dureeAffichage = deborde
      ? Math.round(course * 2 + ARRET_MS * 3)
      : DUREE_MIN_MS;

    var signature = etat.groupe + ":" + Math.round(trop / 20) + ":" + deborde;
    if (etat.animationDefilement && etat.signatureDefilement === signature) return;

    if (etat.animationDefilement) { etat.animationDefilement.cancel(); etat.animationDefilement = null; }
    etat.signatureDefilement = signature;
    el.liste.style.transform = "none";
    if (!deborde) return;

    // Le cycle EST le temps d'affichage : on souffle, on descend, on souffle en
    // bas, on remonte, on souffle — et la catégorie bascule à ce moment-là.
    var duree = etat.dureeAffichage;
    var arret = ARRET_MS / duree;
    var course2 = (duree - ARRET_MS * 3) / 2 / duree;
    var bas = "translateY(" + (-trop) + "px)";
    // L'assouplissement est posé sur chaque intervalle, pas sur l'animation
    // entière : appliqué globalement, il rendait la descente rapide et la
    // remontée saccadée.
    etat.animationDefilement = el.liste.animate([
      { transform: "translateY(0)", offset: 0,                        easing: "linear" },
      { transform: "translateY(0)", offset: arret,                    easing: "ease-in-out" },
      { transform: bas,             offset: arret + course2,          easing: "linear" },
      { transform: bas,             offset: arret * 2 + course2,      easing: "ease-in-out" },
      { transform: "translateY(0)", offset: arret * 2 + course2 * 2,  easing: "linear" },
      { transform: "translateY(0)", offset: 1 },
    ], { duration: duree, iterations: Infinity, easing: "linear" });
  }

  // --- La rotation (mode mur) ----------------------------------------------

  /** Le temps d'affichage retenu : celui que le défilement a calculé, ou la
   *  durée forcée par l'adresse. */
  function dureeRotation() {
    return ROTATION_FIXE_MS || etat.dureeAffichage || DUREE_MIN_MS;
  }

  /** Le glyphe, l'étiquette et `aria-pressed` disent la MÊME chose que l'état.
   *  Appelée aussi au chargement : le bouton d'une page normale doit montrer
   *  ▶ avant qu'on ait cliqué, sinon il annonce une rotation qui ne tourne
   *  pas. */
  function majBoutonPause() {
    el.pause.textContent = etat.enPause ? "▶" : "⏸";
    el.pause.setAttribute("aria-pressed", String(etat.enPause));
    el.pause.setAttribute("aria-label",
      etat.enPause ? "Faire défiler les classements"
                   : "Mettre la rotation en pause");
  }

  majBoutonPause();
  el.pause.addEventListener("click", function () {
    etat.enPause = !etat.enPause;
    majBoutonPause();
    if (etat.enPause) {
      clearTimeout(etat.minuteurRotation);
      figerJauge();
    } else {
      programmerRotation();
    }
    majSuivant();
  });

  /** La jauge s'arrête là où elle en est plutôt que de repartir à zéro : on
   *  reprend la rotation là où on l'a laissée, visuellement aussi. */
  function figerJauge() {
    var actif = chipDe(etat.groupe);
    if (!actif) return;
    var j = actif.querySelector(".jauge");
    if (!j) return;
    var largeur = j.getBoundingClientRect().width;
    j.style.transition = "none";
    j.style.width = largeur + "px";
  }

  function majSuivant() {
    if (!MUR) { el.suivant.textContent = ""; return; }
    if (etat.enPause) { el.suivant.textContent = "rotation en pause"; return; }
    var visibles = groupesVisibles();
    var groupe = visibles.find(function (c) { return c.groupe === etat.groupe; });
    el.suivant.textContent = groupe ? prochainLibelle(visibles, groupe) : "";
  }

  function programmerRotation() {
    // ⚠️ Plus de garde sur `?mur` : c'est `enPause` qui decide, et il part a
    // l'arret hors du mur. Le mode ne pilote plus que la valeur de DEPART.
    if (etat.enPause) return;
    clearTimeout(etat.minuteurRotation);
    var visibles = groupesVisibles();
    if (visibles.length < 2) {
      jauger(0);
      // ⚠️ ON NE RENONCE PAS. La rotation etait armee UNE FOIS, 1,2 s apres le
      // chargement. Un mur allume avant la competition n'avait alors aucun
      // classement -- `visibles.length` valait 0 -- et cette fonction sortait
      // SANS reprogrammer quoi que ce soit. Passer la competition « En
      // cours » ne le reveillait pas : l'ecran restait fige sur la premiere
      // categorie jusqu'a un rechargement a la main. Signale par Adrien le
      // 02/09 (« je m'attends a ce que la page se mette en play »).
      //
      // On repasse donc au rythme du rafraichissement : des que deux
      // classements existent, le defilement demarre tout seul.
      etat.minuteurRotation = setTimeout(programmerRotation, dureeRotation());
      return;
    }

    // La MÊME durée que celle que le défilement vient de calculer.
    var duree = dureeRotation();
    jauger(duree);

    etat.minuteurRotation = setTimeout(function () {
      var v = groupesVisibles();
      var i = v.findIndex(function (c) { return c.groupe === etat.groupe; });
      etat.groupe = v[(i + 1) % v.length].groupe;
      // Un changement de catégorie n'est pas un mouvement de classement : on
      // repart de zéro plutôt que de faire voler les lignes d'un groupe à
      // l'autre.
      etat.noeuds = {};
      etat.deltas = {};
      el.podium.innerHTML = "";
      el.liste.innerHTML = "";
      dessiner();
      centrerBarre();
      programmerRotation();
    }, duree);
  }

  // --- La barre de catégories (spectateur) ---------------------------------

  function chipDe(nom) {
    var trouve = null;
    Array.prototype.forEach.call(el.barre.children, function (b) {
      if (b.dataset.groupe === nom) trouve = b;
    });
    return trouve;
  }

  /** La jauge de la catégorie affichée : elle avance jusqu'à la bascule.
   *
   * C'est le « où on en est » du mode mur, posé là où on regarde déjà — sur le
   * nom de la catégorie — plutôt que sur un filet en haut de l'écran que
   * personne ne relie à rien.
   */
  function jauger(duree) {
    Array.prototype.forEach.call(el.barre.children, function (b) {
      var j = b.querySelector(".jauge");
      if (!j) return;
      j.style.transition = "none";
      j.style.width = "0%";
    });
    var actif = chipDe(etat.groupe);
    if (!actif || !duree || sansMouvement()) return;
    var j = actif.querySelector(".jauge");
    void j.offsetWidth;
    j.style.transition = "width " + duree + "ms linear";
    j.style.width = "100%";
  }

  /** Amène la catégorie affichée dans la partie visible de la barre. */
  function centrerBarre() {
    var actif = chipDe(etat.groupe);
    if (!actif || el.barre.scrollWidth <= el.barre.clientWidth) return;
    var cible = actif.offsetLeft - (el.barre.clientWidth - actif.offsetWidth) / 2;
    el.barre.scrollTo({ left: Math.max(0, cible),
                        behavior: sansMouvement() ? "auto" : "smooth" });
  }

  function dessinerBarre() {
    // Sur le mur, la barre montre le CYCLE : seulement ce qui défile. Sur
    // téléphone elle montre tout ce qu'on peut demander, classement club
    // compris — et, en tête, les favoris du spectateur s'il en a.
    //
    // ⚠️ `groupesVisibles()` DES DEUX CÔTÉS. La barre lisait
    // `etat.classements` sur téléphone, c'est-à-dire la charge brute, masque
    // compris : éteindre un scratch dans la console ne retirait pas sa
    // pastille, et le classement restait accessible d'un doigt. « Je retire
    // des scratchs de l'affichage, je rafraîchis, rien ne se passe » —
    // Adrien, 02/09. Le réglage de la spec 020 s'applique PARTOUT, c'est ce
    // que `groupesVisibles()` dit de lui-même deux cents lignes plus haut :
    // deux commentaires disaient l'inverse l'un de l'autre, et le code
    // suivait le mauvais.
    var groupes = groupesVisibles();
    if (!MUR && etat.favoris.length) {
      groupes = [{ groupe: GROUPE_FAVORIS, type: "favoris", lignes: [] }].concat(groupes);
    }
    var avecFavori = MUR ? {} : categoriesAvecFavori();
    if (groupes.length < 2) { el.barre.innerHTML = ""; el.barre.hidden = true; return; }
    el.barre.hidden = false;

    var memesGroupes = el.barre.childElementCount === groupes.length
      && groupes.every(function (c, i) {
        var b = el.barre.children[i];
        return b.dataset.groupe === c.groupe
            && b.dataset.favori === String(!!avecFavori[c.groupe]);
      });

    if (!memesGroupes) {
      el.barre.innerHTML = "";
      groupes.forEach(function (c, i) {
        var b = document.createElement("button");
        b.type = "button";
        b.dataset.groupe = c.groupe;
        b.dataset.favori = String(!!avecFavori[c.groupe]);
        b.style.setProperty("--teinte", couleurDe(c.groupe));
        var jauge = document.createElement("span");
        jauge.className = "jauge";
        var etiquette = document.createElement("span");
        etiquette.className = "etiquette";
        etiquette.textContent = libelleDe(c);       // textContent, jamais innerHTML
        b.appendChild(jauge);
        b.appendChild(etiquette);
        // Une catégorie où quelqu'un qu'on suit grimpe se signale d'une étoile.
        if (avecFavori[c.groupe]) {
          var marqueur = document.createElement("span");
          marqueur.className = "marqueur";
          marqueur.textContent = "★";
          b.insertBefore(marqueur, etiquette);
        }
        b.addEventListener("click", function () { choisir(c.groupe); });
        el.barre.appendChild(b);
      });
    }

    Array.prototype.forEach.call(el.barre.children, function (b) {
      var actif = b.dataset.groupe === etat.groupe;
      b.setAttribute("aria-current", String(actif));
      b.setAttribute("aria-pressed", String(actif));
    });
  }

  /** Choisir une catégorie à la main — au doigt sur téléphone, à la souris sur
   *  l'ordinateur de la salle. Sur le mur, la rotation repart d'ici : on ne
   *  veut pas qu'elle ramène l'écran ailleurs deux secondes plus tard. */
  function choisir(groupe) {
    if (groupe === etat.groupe) return;
    etat.groupe = groupe;
    etat.noeuds = {};
    etat.deltas = {};
    el.podium.innerHTML = "";
    el.liste.innerHTML = "";
    dessiner();
    centrerBarre();
    programmerRotation();
  }

  // --- Le balayage tactile : d'une catégorie à l'autre ---------------------
  //
  // Sur un téléphone, changer de catégorie en visant une pastille de la barre
  // demande de regarder ce qu'on touche. Un balayage, non.

  var toucher = null;

  document.addEventListener("touchstart", function (e) {
    if (MUR || e.touches.length !== 1) { toucher = null; return; }
    // On ignore ce qui part de la barre : elle défile déjà horizontalement.
    if (e.target.closest && e.target.closest("#barre, #recherche")) { toucher = null; return; }
    toucher = { x: e.touches[0].clientX, y: e.touches[0].clientY };
  }, { passive: true });

  document.addEventListener("touchend", function (e) {
    if (!toucher || !e.changedTouches.length) return;
    var dx = e.changedTouches[0].clientX - toucher.x;
    var dy = e.changedTouches[0].clientY - toucher.y;
    toucher = null;
    // Franc, et horizontal : sinon on volerait le défilement vertical de la
    // page, qui est le geste le plus fréquent sur un classement.
    if (Math.abs(dx) < 60 || Math.abs(dx) < Math.abs(dy) * 1.8) return;
    voisin(dx < 0 ? 1 : -1);
  }, { passive: true });

  /** La catégorie suivante (+1) ou précédente (−1) dans la barre. */
  function voisin(pas) {
    var pastilles = Array.prototype.map.call(el.barre.children, function (b) {
      return b.dataset.groupe;
    });
    if (pastilles.length < 2) return;
    var i = pastilles.indexOf(etat.groupe);
    if (i < 0) i = 0;
    choisir(pastilles[(i + pas + pastilles.length) % pastilles.length]);
  }

  el.recherche.addEventListener("input", function () {
    etat.noeuds = {};
    el.liste.innerHTML = "";
    dessiner();
  });

  el.masquerRecherche.addEventListener("click", function () {
    var masquee = !etat.sansRecherche;
    basculerRecherche(masquee);
    // Masquer un filtre ENCORE ACTIF laisserait une liste filtrée sans rien
    // pour expliquer pourquoi. On vide donc la recherche en même temps.
    if (masquee && el.recherche.value) {
      el.recherche.value = "";
      etat.noeuds = {};
      el.liste.innerHTML = "";
    }
    dessiner();
  });

  // L'état est relu au démarrage : le choix survit au rechargement, ce qui est
  // tout l'intérêt sur une machine qui projette toute la journée.
  basculerRecherche(lireSansRecherche());

  // Redimensionnement : la hauteur des lignes et le défilement en dépendent.
  var minuteurTaille;
  window.addEventListener("resize", function () {
    clearTimeout(minuteurTaille);
    minuteurTaille = setTimeout(function () { dessiner(); centrerBarre(); }, 120);
  });

  // --- Démarrage ------------------------------------------------------------

  charger();
  // Une archive ne bouge plus : la relire toutes les 15 s ne ferait que du
  // trafic. Un seul appel, et c'est fini.
  // ⚠️ La fiche ouverte se rafraichit AU MEME BATTEMENT que le classement.
  // Sans ce second appel, elle restait figee pendant que la ligne derriere elle
  // affichait deja un bloc de plus.
  if (!ARCHIVE) setInterval(function () { charger(); rafraichirFiche(); }, PERIODE_MS);
  setInterval(majMeta, 5000);
  // =========================================================================
  // LA FICHE DU GRIMPEUR, ET LE MUR — spec 026
  //
  // ⚠️ UNE SEULE REGLE, ET TOUT EN DECOULE : **l'historique est la seule
  // source de verite**. Ouvrir ecrit le diese, fermer appelle `history.back()`,
  // et c'est `hashchange` — lui seul — qui repeint. Des qu'on ouvre ou ferme
  // « directement », l'affichage et l'historique divergent, et le bouton retour
  // du telephone sort du site au lieu de fermer la fiche.
  //
  // Le DIESE et pas un parametre : il ne part jamais au serveur. La racine est
  // mise en cache 5 s par Caddy, et `?g=42` creerait une entree de cache par
  // grimpeur et par zone pour un HTML rigoureusement identique.
  // =========================================================================

  var PLAN = (function () {
    var n = document.getElementById("plan-du-mur");
    try { return n ? JSON.parse(n.textContent) : null; } catch (e) { return null; }
  })();
  // Les zones que le plan sait dessiner. Un bloc dont la zone n'y est pas
  // n'ouvre RIEN : mieux vaut une case inerte qu'un bloc montre au mauvais
  // endroit. C'est ce qui fait tenir la page quand `PLAN` change de forme.
  var ZONES_DU_PLAN = zonesDe(PLAN);
  var PLAN_DESSINABLE = peutDessiner(PLAN);

  var fiche = { id: null, zone: null, mur: false, donnees: null, defile: 0,
                enCours: null, rebondir: false, montePour: null };

  // ⚠️ COMBIEN D'ENTREES D'HISTORIQUE SONT LES NOTRES.
  //
  // `quitter()` faisait `history.back()` sans condition. Sur un lien PARTAGE
  // — `/#g=42` ouvert directement, l'usage meme pour lequel le diese existe —
  // il n'y a rien a remonter : `back()` ne fait rien, la croix, Echap et le
  // voile deviennent inertes, et `document.body.style.overflow` reste a
  // `hidden`. Le classement derriere est fige et la page ne se recupere qu'en
  // rechargeant.
  var poussees = 0;
  var elFeuille = null, elVoile = null;

  function lignesDuGrimpeur(id) {
    // « Aussi classe U13 5e » ne coute AUCUNE requete : la page a deja tous
    // les classements en memoire.
    var ailleurs = [];
    etat.classements.forEach(function (c) {
      if (c.groupe === etat.groupe || c.type === "club") return;
      // ⚠️ Les classements MASQUES par la console (spec 020) ne doivent pas
      // ressortir ici. La charge publique les envoie tous — c'est la page qui
      // filtre — et cette fonction court-circuitait `groupesVisibles()`. Un
      // organisateur qui cache un classement contesté le voyait reapparaitre
      // dans chaque fiche.
      if (etat.groupesMasques.indexOf(c.groupe) >= 0) return;
      (c.lignes || []).forEach(function (l) {
        if (Number(l.participant_id) === id) {
          ailleurs.push({ groupe: c.groupe, rang: l.rang });
        }
      });
    });
    return ailleurs;
  }

  function ligneCourante(id) {
    var courant = etat.classements.filter(function (c) {
      return c.groupe === etat.groupe;
    })[0];
    var trouvee = null;
    ((courant && courant.lignes) || []).forEach(function (l) {
      if (Number(l.participant_id) === id) trouvee = l;
    });
    return { ligne: trouvee, groupe: courant ? courant.groupe : null,
             tete: courant && courant.lignes.length ? courant.lignes[0].score : 0 };
  }

  function bouton(classe, parent, texte) {
    var n = div(classe, parent, "button");
    n.type = "button";
    if (texte != null) n.textContent = texte;
    return n;
  }

  function ordinal(rang) { return rang === 1 ? "1er" : rang + "e"; }

  // --- Le rendu de la fiche -------------------------------------------------

  function peindreFiche(vue) {
    var d = fiche.donnees;
    var p = d.participant;

    var tete = div("sf-tete", vue);
    var doss = div("sf-dossard", tete);
    div("", doss, "small").textContent = "Dossard";
    doss.appendChild(document.createTextNode(p.dossard == null ? "—" : p.dossard));
    var qui = div("sf-qui", tete);
    div("", qui, "b").textContent = p.nom;
    if (p.club) div("", qui, "span").textContent = p.club;
    div("", qui, "span").textContent =
      [p.categorie, p.circuit ? "circuit " + p.circuit : null]
        .filter(Boolean).join(" · ");
    var fermer = bouton("sf-rond", tete, "✕");
    fermer.setAttribute("aria-label", "Fermer la fiche");
    fermer.addEventListener("click", quitter);

    var ici = ligneCourante(p.id);
    if (ici.ligne) {
      var rang = div("sf-rang", vue);
      div("grand", rang, "span").textContent = ordinal(ici.ligne.rang);
      div("ou", rang, "span").textContent = ici.groupe;
      var pts = div("pts", rang);
      div("", pts, "b").textContent = ici.ligne.score;
      var retard = (ici.tete || 0) - ici.ligne.score;
      div("", pts, "span").textContent =
        retard > 0 ? "a −" + retard + " du premier" : "en tete";
    }
    var ailleurs = lignesDuGrimpeur(p.id);
    if (ailleurs.length) {
      var ligne = div("sf-ailleurs", vue);
      ligne.textContent = "Aussi classe : " + ailleurs.map(function (a) {
        return a.groupe + " " + ordinal(a.rang);
      }).join(" · ");
    }

    var corps = div("sf-corps", vue);
    var avance = div("sf-avance", corps);
    div("", avance, "h2").textContent = d.total
      ? "Tes " + d.total + " blocs" : "Tes blocs";
    if (d.total) {
      var compte = [d.grimpes + " grimpes"];
      if (d.credites) compte.push(d.credites + " credites");
      div("", avance, "em").textContent = compte.join(" · ");
    }
    // Le mur s'ouvre AUSSI sans passer par un bloc : on cherche parfois « ou
    // me reste-t-il du travail », pas « ou est ce bloc-la ».
    if (PLAN_DESSINABLE && d.total) {
      var vers = bouton("sf-vers-mur", avance, "Le mur ›");
      vers.addEventListener("click", function () { versZone(null, false); });
    }
    if (d.total) {
      var jauge = div("sf-jauge", corps);
      div("", jauge, "i").style.width =
        Math.round((d.grimpes + d.credites) / d.total * 100) + "%";
    }
    if (d.manque) div("sf-manque", corps).textContent = d.manque;

    var couleurs = div("sf-couleurs", corps);
    (d.groupes || []).forEach(function (g) {
      var bloc = div("", couleurs);
      var t = div("sf-couleur-tete", bloc);
      div("", t, "i").style.background = teinteDifficulte(g.couleur);
      div("", t, "span").textContent = g.couleur || "sans couleur";
      var faits = g.blocs.filter(function (b) { return b.etat !== "reste"; }).length;
      div("", t, "em").textContent = faits + "/" + g.blocs.length;
      var cases = div("sf-cases", bloc);
      g.blocs.forEach(function (b) { cases.appendChild(caseDeBloc(b)); });
    });
  }

  // Les six couleurs de difficulte, aux memes valeurs que la fiche PAPIER : le
  // grimpeur tient sa feuille dans une main et son telephone dans l'autre.
  var TEINTES = { Jaune: "#F2C230", Vert: "#3FA45B", Bleu: "#3A7BD5",
                  Mauve: "#8E5FBF", Rouge: "#D0342C", Noir: "#222222" };
  function teinteDifficulte(nom) { return TEINTES[nom] || "var(--trait)"; }

  function caseDeBloc(b) {
    // Un bloc CREDITE n'ouvre pas le mur : on n'envoie personne grimper ce
    // qu'il n'a pas besoin de grimper. Un bloc dont la zone est absente du
    // plan non plus.
    var ouvrable = b.etat !== "credite" && ZONES_DU_PLAN.has(b.zone);
    var n = document.createElement(ouvrable ? "button" : "span");
    n.className = "sf-case " + b.etat;
    if (b.zone) div("z", n, "span").textContent = b.zone;
    div("n", n, "span").textContent = b.numero;
    if (ouvrable) {
      n.type = "button";
      n.setAttribute("aria-label", "Bloc " + b.numero + ", zone " + b.zone
        + ", " + (b.etat === "grimpe" ? "grimpe" : "reste a faire")
        + ". Voir sur le mur");
      n.addEventListener("click", function () { versZone(b.zone, true); });
    }
    return n;
  }

  // --- Le rendu du mur ------------------------------------------------------
  //
  // ⚠️ LE DESSIN PERSISTE tant qu'on regarde le meme grimpeur. Il etait
  // reconstruit a chaque repeinture -- dix-sept zones et leurs trames pour un
  // simple changement de zone -- et surtout la PILE l'etait aussi, ce qui
  // empechait toute transition : un element fraichement insere ne transitionne
  // pas. Le commentaire de la feuille de style promettait que « la fiche RESTE
  // montee sous le mur » ; ce n'etait pas vrai.

  function peindreMur(vue, refaire) {
    var d = fiche.donnees;
    var etats = etatsDesZones(d.groupes || []);
    var zone = fiche.zone;

    if (refaire) {
      vue.innerHTML = "";
      var tete = div("sf-mur-tete", vue);
      var retour = bouton("sf-rond", tete, "‹");
      retour.setAttribute("aria-label", "Retour a la fiche");
      retour.addEventListener("click", quitter);
      var quoi = div("quoi", tete);
      div("", quoi, "b");
      div("", quoi, "span").textContent =
        d.participant.nom
        + (d.participant.circuit ? " · circuit " + d.participant.circuit : "");

      var corps = div("sf-corps", vue);
      var carte = div("sf-carte", corps);
      var dessin = monter(decrire(PLAN), document);
      if (!dessin) {
        // Le plan a change de forme et la page ne sait pas le dessiner. On le
        // DIT et on ne dessine rien : un plan compris a moitie enverrait
        // chercher un bloc au mauvais endroit.
        carte.remove();
        div("sf-manque", corps).textContent =
          "Le plan de la salle n'est pas affichable par cette version de la page.";
        return;
      }
      // Toucher une zone la choisit. C'est la PAGE qui ecoute : le dessin, lui,
      // ne sait rien de ce qu'on fait de ses zones.
      Array.prototype.forEach.call(dessin.querySelectorAll("g[data-zone]"),
        function (n) {
          n.addEventListener("click", function () {
            versZone(n.getAttribute("data-zone"), false);
          });
        });
      carte.appendChild(dessin);

      var leg = div("sf-legende", corps);
      div("", leg, "i");
      leg.appendChild(document.createTextNode("zone terminee"));
      div("sf-panneau", corps);
    }

    var titre = vue.querySelector(".sf-mur-tete .quoi b");
    if (titre) titre.textContent = zone ? "Zone " + zone : "Le mur";

    var dessine = vue.querySelector("svg.plan");
    if (dessine) decorer(dessine, etats, zone);

    var panneau = vue.querySelector(".sf-panneau");
    if (!panneau) return;
    panneau.innerHTML = "";

    if (!zone) {
      div("sf-note", panneau).textContent =
        "Touche une zone pour voir les blocs de ton circuit qui s'y trouvent.";
      return;
    }

    var siens = blocsDeZone(d.groupes || [], zone);
    var bas = div("sf-zone", panneau);
    var t = div("", bas, "h3");
    if (!siens.length) {
      t.textContent = "Zone " + zone;
      div("sf-note", bas).textContent = "Aucun bloc de ton circuit dans cette zone.";
      return;
    }
    t.textContent = "Zone " + zone + " — tes " + siens.length
      + (siens.length > 1 ? " blocs" : " bloc");
    var c = compteDeZone(d.groupes || [], zone);
    var compte = div("sf-compte", t, "span");
    compte.textContent = c.faits === c.total ? "terminee" : c.faits + " sur " + c.total;
    if (c.faits === c.total) compte.classList.add("finie");
    var cases = div("sf-cases", bas);
    siens.forEach(function (b) { cases.appendChild(caseDeBloc(b)); });
  }

  // --- Monter, demonter -----------------------------------------------------

  var elPile = null, elVueFiche = null, elVueMur = null;

  function monterFeuille() {
    elVoile = div("sf-voile");
    elVoile.addEventListener("click", quitter);
    document.body.appendChild(elVoile);
    elFeuille = div("sf-feuille");
    elFeuille.setAttribute("role", "dialog");
    elFeuille.setAttribute("aria-modal", "true");
    div("sf-poignee", elFeuille);
    elPile = div("sf-pile", elFeuille);
    elVueFiche = div("sf-vue", elPile);
    elVueMur = div("sf-vue", elPile);
    document.body.appendChild(elFeuille);
    // Une feuille ouverte fige le classement derriere elle : sinon on fait
    // defiler le mauvais plan sous le doigt.
    document.body.style.overflow = "hidden";
  }

  function peindreFeuille(rebondir) {
    var neuf = !elFeuille;
    if (neuf) monterFeuille();

    // ⚠️ On SAUVE avant de reconstruire, et on restaure apres. Cette position
    // n'etait sauvee que dans la branche « le grimpeur a change » -- le seul
    // cas ou il ne faut justement pas la restaurer. Sur un circuit de quarante
    // blocs, chaque aller-retour vers le mur renvoyait en haut de la liste.
    var corpsAvant = elVueFiche.querySelector(".sf-corps");
    if (corpsAvant) fiche.defile = corpsAvant.scrollTop;

    elVueFiche.innerHTML = "";
    peindreFiche(elVueFiche);
    peindreMur(elVueMur, neuf || fiche.montePour !== fiche.id);
    fiche.montePour = fiche.id;

    var corps = elVueFiche.querySelector(".sf-corps");
    if (corps) corps.scrollTop = fiche.defile;

    // La transition vient de ce que LA PILE PERSISTE : la classe se pose donc
    // directement, et le navigateur interpole tout seul.
    //
    // ⚠️ SURTOUT PAS de `requestAnimationFrame` ici. Un etat d'affichage ne
    // doit pas dependre d'une image a venir : rAF est etrangle dans un onglet
    // d'arriere-plan et ne se declenche pas du tout sans compositeur — la
    // feuille resterait sur la fiche alors que l'etat dit « mur ». Il n'etait
    // la que pour contourner la reconstruction de la pile, qui n'existe plus.
    // Au premier montage il n'y a pas de transition, et c'est voulu : la
    // feuille ne glisse pas quand elle s'ouvre.
    elPile.classList.toggle("au-mur", fiche.mur);

    var anime = !!rebondir && !sansMouvement();
    elFeuille.classList.toggle("sf-anime", anime);
    if (anime) {
      // Le dessin persiste : sans ce redemarrage, l'animation ne rejouerait
      // pas d'une zone a l'autre.
      var visee = elVueMur.querySelector("g[data-zone].visee");
      if (visee) {
        visee.style.animation = "none";
        void visee.getBoundingClientRect();
        visee.style.animation = "";
      }
    }
  }

  function demonter() {
    if (elVoile) elVoile.remove();
    if (elFeuille) elFeuille.remove();
    elVoile = elFeuille = elPile = elVueFiche = elVueMur = null;
    document.body.style.overflow = "";
    fiche = { id: null, zone: null, mur: false, donnees: null, defile: 0,
              enCours: null, rebondir: false, montePour: null };
    // Les entrees qu'on avait empilees ne sont plus les notres.
    poussees = 0;
  }

  // --- L'historique, seule source de verite ---------------------------------

  function versDiese(etatDiese, remplacer) {
    var cible = ecrireDiese(etatDiese);
    var url = location.pathname + location.search + cible;
    if (remplacer) {
      history.replaceState(null, "", url);
      appliquer();                      // `replaceState` ne declenche rien
    } else if (cible !== location.hash) {
      poussees += 1;
      location.hash = cible;            // declenche `hashchange`
    } else {
      appliquer();
    }
  }

  /** Efface le diese sans empiler d'entree, et repeint. */
  function nettoyerAdresse() {
    history.replaceState(null, "", location.pathname + location.search);
    appliquer();
  }

  function ouvrir(id) { versDiese({ grimpeur: id, zone: null, mur: false }, false); }

  function versZone(zone, rebondir) {
    // Changer de zone REMPLACE l'entree du dessus : un retour doit ramener a la
    // fiche, pas defaire une par une les zones qu'on a regardees.
    fiche.rebondir = !!rebondir;
    versDiese({ grimpeur: fiche.id, zone: zone, mur: true }, fiche.mur);
  }

  function quitter() {
    if (fiche.id === null) return;
    // On ne ferme jamais « directement » : on remonte l'historique, et c'est
    // `hashchange` qui demonte. Sinon l'entree reste et le bouton retour
    // rouvre une fiche qu'on croyait fermee.
    if (poussees > 0) { poussees -= 1; history.back(); return; }
    // ...SAUF quand aucune entree n'est de nous : la page a ete ouverte
    // DIRECTEMENT sur `/#g=42`. `back()` sortirait du site, ou ne ferait rien
    // du tout et laisserait la feuille ouverte pour toujours. On efface alors
    // le diese sur place.
    nettoyerAdresse();
  }

  function appliquer() {
    var cible = lireDiese(location.hash);
    if (cible.grimpeur === null) { demonter(); return; }

    // ⚠️ LA ZONE DE L'ADRESSE SE VERIFIE, comme le grimpeur. Un bloc dont la
    // zone est absente du plan est deja rendu inerte ; une zone NOMMEE DANS
    // L'ADRESSE ne l'etait pas, et `#g=42&z=QQQ` affichait un panneau « Zone
    // QQQ » au-dessus d'un dessin qui ne la porte pas. Le cas n'existe que
    // depuis la spec 029 : un lien partage le matin peut etre ouvert
    // l'apres-midi sur un mur redessine.
    if (cible.zone !== null && !ZONES_DU_PLAN.has(cible.zone)) {
      fiche.zone = null;
      fiche.mur = cible.mur;
      history.replaceState(null, "",
        location.pathname + location.search
        + ecrireDiese({ grimpeur: cible.grimpeur, zone: null, mur: cible.mur }));
    } else {
      fiche.zone = cible.zone;
      fiche.mur = cible.mur;
    }

    if (fiche.id === cible.grimpeur && fiche.donnees) {
      peindreFeuille(fiche.rebondir); fiche.rebondir = false; return;
    }

    fiche.id = cible.grimpeur;
    fiche.donnees = null;
    charger_fiche(cible.grimpeur);
  }

  function charger_fiche(id) {
    var jeton = {};
    fiche.enCours = jeton;
    fetch("/api/public/grimpeur/" + id, { cache: "no-store" })
      .then(function (r) {
        if (r.status === 404) throw { introuvable: true };
        if (!r.ok) throw new Error("HTTP " + r.status);
        return r.json();
      })
      .then(function (d) {
        if (fiche.enCours !== jeton || fiche.id !== id) return;   // clic suivant
        fiche.donnees = d;
        peindreFeuille(fiche.rebondir); fiche.rebondir = false;
      })
      .catch(function (e) {
        if (fiche.enCours !== jeton || fiche.id !== id) return;
        // Un grimpeur inconnu — efface, ou l'adresse d'une autre edition —
        // NETTOIE l'adresse : sans ca, le retour ramene a un etat mort.
        if (e && e.introuvable) { nettoyerAdresse(); return; }
        // Une coupure reseau, elle, ne doit RIEN effacer. La feuille se
        // refermait sans un mot sur un simple 500 ou un Wi-Fi qui saute ; si on
        // a deja les donnees on les garde, sinon on le DIT.
        if (fiche.donnees) return;
        if (!elFeuille) monterFeuille();
        elVueFiche.innerHTML = "";
        div("sf-manque", elVueFiche).textContent =
          "La fiche n'a pas pu etre chargee. Elle reessaiera toute seule.";
      });
  }

  /** Rafraichir la fiche ouverte au rythme de la page : un bloc valide pendant
   *  qu'on la regarde doit passer au vert tout seul.
   *
   * ⚠️ Cette fonction a existe SANS APPELANT. La fiche restait figee pendant
   * que la ligne du classement, juste derriere la feuille, affichait deja le
   * bloc de plus — la page se contredisait elle-meme, et la fonctionnalite qui
   * s'appelle « en direct » ne l'etait pas. Elle est branchee sur le meme
   * battement que le classement, au demarrage.
   */
  function rafraichirFiche() {
    if (fiche.id !== null && fiche.donnees) charger_fiche(fiche.id);
  }

  // ⚠️ `!ARCHIVE` autant que `!MUR`. La spec 026 met le rejeu d'archive HORS
  // perimetre — « la route publique ne parle que de la competition active » —
  // mais la garde n'existait que pour le mode mur. En rejeu, une ligne restait
  // donc cliquable et `GET /api/public/grimpeur/<id>` repondait avec la
  // competition ACTIVE.
  //
  // Ce n'est pas seulement une fiche vide : `Participant.id` est un rowid
  // SQLite, et effacer une edition (spec 018) LIBERE ses identifiants. La
  // suivante les reprend. Mesure faite : apres avoir archive puis efface mars,
  // les participants de novembre reprennent les id 1 et 2. Toucher la ligne
  // « MARS-Alice » ouvrait alors la fiche de « NOV-Chloe » — une autre
  // personne, reelle et nommee, sous le nom affiche par la ligne.
  if (!MUR && !ARCHIVE) {
    // Delegation : la page n'a pas a poser un gestionnaire par ligne, et les
    // lignes sont recreees a chaque repeinture.
    el.principal.addEventListener("click", function (e) {
      if (e.target.closest(".etoile")) return;      // l'etoile garde son clic
      var porteur = e.target.closest("[data-participant]");
      if (!porteur) return;
      var id = Number(porteur.dataset.participant);
      if (id) ouvrir(id);
    });
    window.addEventListener("hashchange", appliquer);
    document.addEventListener("keydown", function (e) {
      if (e.key === "Escape" && fiche.id !== null) quitter();
    });
    // ⚠️ APRES le premier rendu, jamais a la place : arriver sur `/#g=42` doit
    // dessiner le classement PUIS ouvrir la fiche par-dessus.
    setTimeout(appliquer, 0);
  }

  // Le premier armement. `programmerRotation` se garde elle-meme sur
  // `enPause`, qui vaut deja « a l'arret » hors du mur.
  setTimeout(programmerRotation, 1200);
})();
</script>
</body>
</html>
