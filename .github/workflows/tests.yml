name: tests

# La CI de release ne se declenche que sur une etiquette vX.Y.Z : les tests n'y
# passaient donc qu'au moment de publier, quand la branche est deja fusionnee et
# qu'il est trop tard pour corriger tranquillement. Ce fichier les fait tourner
# la ou ils servent -- sur la PR, avant la porte 7.
on:
  pull_request:
  push:
    branches: [master]

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Dependances
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      # Inclut les tests E2E, qui lancent un vrai gunicorn a quatre workers sur
      # une base neuve : c'est la seule facon de reproduire le demarrage a froid
      # du jour de la competition.
      - name: Tests
        run: pytest -q

      # La logique de la PWA juge (spec 007) est en JavaScript, et testee sur
      # Node : ce qui decide -- le jeton, le contrat HTTP -- doit se tester sans
      # navigateur, sinon ca ne se teste pas. Node est deja sur le runner.
      - name: Tests JavaScript de la PWA juge
        run: node --test "tests/js/*.test.mjs"

      - name: L'application demarre-t-elle vraiment ?
        env:
          CLIMBCONTEST_SHEETS_ACTIF: "0"
          # Depuis la spec 012, le mode strict est le defaut et une installation
          # SANS cle est degradee a dessein -- c'est ce qui doit faire echouer un
          # deploiement. Ici on demarre une installation correcte, donc elle a
          # une cle. La configuration incoherente a son propre test juste apres.
          CLIMBCONTEST_API_KEY: cle-de-ci
        run: |
          python -c "
          from climbcontest import creer_app
          app = creer_app()
          with app.test_client() as c:
              r = c.get('/health')
              assert r.status_code == 200, r.status_code
              print('/health ->', r.get_json())
          "

      # Le pendant : une installation en mode strict SANS cle doit se declarer
      # degradee. C'est ce qui empeche l'agent de deploiement de mettre en
      # production un serveur ou toutes les routes du juge repondent 503.
      - name: Une installation sans cle se declare-t-elle degradee ?
        env:
          CLIMBCONTEST_SHEETS_ACTIF: "0"
        run: |
          python -c "
          from climbcontest import creer_app
          app = creer_app()
          with app.test_client() as c:
              r = c.get('/health')
              assert r.status_code == 503, r.status_code
              d = r.get_json()
              assert d['status'] == 'degraded', d
              assert 'CLIMBCONTEST_API_KEY' in d['cle_api'], d
              print('sonde degradee comme attendu ->', d['cle_api'])
          "
