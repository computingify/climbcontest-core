name: release

# Declenche par une etiquette vX.Y.Z. Construit, teste, et publie une archive
# signee par son empreinte SHA-256. La VM la tire ensuite elle-meme : aucun
# runner ne touche a la production (decision 16 du dossier de migration).
on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Version depuis l'etiquette
        id: version
        run: |
          TAG="${GITHUB_REF_NAME}"
          echo "tag=$TAG"            >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}"    >> "$GITHUB_OUTPUT"

      # --- LA PORTE : pas de section de changelog, pas de release. ----------
      # Volontairement AVANT toute construction : echouer en 5 secondes plutot
      # qu'apres avoir installe les dependances.
      - name: Le changelog documente-t-il cette version ?
        run: |
          python3 scripts/extract_changelog.py "${{ steps.version.outputs.version }}" \
            > /tmp/notes.md
          echo "--- corps de la release ---"
          cat /tmp/notes.md

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Dependances
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      # Plus de garde conditionnelle : elle datait de la spec 001, quand il n'y
      # avait pas encore de test. Une suite disparue laisserait passer une
      # release sans que rien ne l'annonce — c'est exactement ce qu'on veut voir
      # echouer.
      - name: Tests
        run: pytest -q

      - name: L'application demarre-t-elle ?
        env:
          # Les memes variables que tests.yml, et pour la meme raison : depuis
          # la spec 012 le mode strict est le defaut, et une application SANS
          # cle repond 503 a dessein. Sans elles, ce smoke test echouait des
          # que le defaut strict a ete active -- constate sur la release
          # v0.7.0, premiere taguee apres.
          CLIMBCONTEST_SHEETS_ACTIF: "0"
          CLIMBCONTEST_API_KEY: cle-de-ci
        run: |
          echo "${{ steps.version.outputs.tag }}" > VERSION
          python -c "
          import wsgi
          c = wsgi.app.test_client()
          r = c.get('/health')
          assert r.status_code == 200, r.status_code
          v = r.get_json()['version']
          attendu = '${{ steps.version.outputs.tag }}'
          assert v == attendu, f'/health annonce {v!r} au lieu de {attendu!r}'
          print('/health repond', r.get_json())
          "

      - name: Construire l'archive
        id: archive
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          NOM="climbcontest-$TAG"
          mkdir -p "build/$NOM"

          # Ce qui part en production, et rien d'autre. Ni .git, ni docs, ni
          # specs, ni fixtures, ni rapports, ni les scripts de charge.
          cp wsgi.py requirements.txt VERSION "build/$NOM/"

          # Le paquet s'appelle « climbcontest ». La version precedente copiait
          # « climb_contest », qui n'a jamais existe -- et le `|| true` avalait
          # l'echec : l'archive partait SANS l'application, et gunicorn serait
          # mort sur ModuleNotFoundError au premier deploiement. Pas de garde
          # tolerante ici : si le paquet manque, la release doit echouer.
          cp -r climbcontest "build/$NOM/"
          cp -r migrations   "build/$NOM/"
          for facultatif in static templates; do
            [ -d "$facultatif" ] && cp -r "$facultatif" "build/$NOM/"
          done

          # Rien de superflu : les caches et les .pyc n'ont pas a voyager.
          find "build/$NOM" -name __pycache__ -type d -exec rm -rf {} + 2>/dev/null || true

          # La verification qui aurait attrape le defaut : l'archive doit
          # pouvoir demarrer TOUTE SEULE, sans le depot autour.
          ( cd "build/$NOM" \
            && python -c "import ast, pathlib; ast.parse(pathlib.Path('wsgi.py').read_text())" \
            && test -f climbcontest/__init__.py ) \
            || { echo "ECHEC : l'archive ne contient pas l'application"; exit 1; }

          tar -czf "$NOM.tar.gz" -C build "$NOM"
          sha256sum "$NOM.tar.gz" | awk '{print $1}' > "$NOM.tar.gz.sha256"

          echo "nom=$NOM" >> "$GITHUB_OUTPUT"
          echo "--- contenu ---"; tar -tzf "$NOM.tar.gz"
          echo "--- empreinte ---"; cat "$NOM.tar.gz.sha256"

      # Publie avec `gh`, deja present sur le runner : pas d'action tierce,
      # donc rien a epingler ni a auditer dans la chaine d'approvisionnement.
      - name: Publier la release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.version.outputs.tag }}" \
            --title "${{ steps.version.outputs.tag }}" \
            --notes-file /tmp/notes.md \
            "${{ steps.archive.outputs.nom }}.tar.gz" \
            "${{ steps.archive.outputs.nom }}.tar.gz.sha256"
